[project]
name = "notte-evervault-example"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "playwright==1.63.0"]

[dependency-groups]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0"]

[tool.uv]
package = false

[tool.uv.workspace]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
