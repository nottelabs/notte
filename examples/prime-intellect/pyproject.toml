[project]
name = "notte-prime-example"
version = "0.1.0"
description = "A Notte browser taskset for Prime Intellect Verifiers"
requires-python = ">=3.11,<3.15"
dependencies = ["verifiers==0.4.0", "notte-sdk>=1.9.7,<2", "playwright==1.63.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notte_prime"]

[tool.uv.workspace]
