[project]
name = "notte-sdk"
version = "1.9.3.dev0"
description = "The SDK for Notte"
readme = "README.md"
authors = [
    { name = "Notte Team ", email = "hello@notte.cc" }
]
packages = [
  { include = "notte_sdk", from = "src" },
]

requires-python = ">=3.11"
dependencies = [
    "halo>=0.0.28",
    "requests>=2.32.3,<3",
    "urllib3>=2.2.3,<3",
    "notte-core==1.9.3.dev0",
    "websockets>=13.1",
]

[project.optional-dependencies]
playwright = [
    "playwright~=1.55",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
