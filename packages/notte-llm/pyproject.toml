[project]
name = "notte-llm"
version = "2.0.0.dev0"
description = "LLM-based structured data extraction for Notte sessions"
readme = "README.md"
authors = [
    { name = "Notte Team ", email = "hello@notte.cc" }
]
packages = [
  { include = "notte_llm", from = "src" },
]

requires-python = ">=3.11"
dependencies = [
    "notte_core==2.0.0.dev0",
    "chevron>=0.14.0",
    "httpx>=0.28.1",
    "json-repair>=0.57.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
