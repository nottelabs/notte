[project]
name = "notte-core"
version = "1.10.3.dev0"
description = "Shared models, actions and config for the Notte packages"
readme = "README.md"
authors = [
    { name = "Notte Team ", email = "hello@notte.cc" }
]
packages = [
  { include = "notte_core", from = "src" },
]

requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "pillow>=11.1.0",
    "posthog>=3.0.1,<=7.63.0",
    "pydantic>=2.10.6",
    "pyotp>=2.9.0",
    "requests>=2.32.3",
    "tldextract>=5.3.0",
    "scarf-sdk>=0.1.2",
    "packaging>=25.0",
]

[project.optional-dependencies]
# `notte_core.profiling` spans (off by default, `enable_profiling` in the config). Imported only once enabled.
profiling = [
    "opentelemetry-sdk>=1.34.1",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
