[project]
name = "notte-browser"
version = "1.4.4.dev"
description = "The web browser for LLMs agents"
readme = "README.md"
authors = [
    { name = "Notte Team ", email = "hello@notte.cc" }
]
packages = [
  { include = "notte_browser", from = "src" },
]


requires-python = ">=3.11"
dependencies = [
    "notte_core==1.4.4.dev",
    "notte_llm==1.4.4.dev",
    "html2text>=2025.4.15",
    "lxml>=5.3.1",
    "markdownify>=0.14.1",
    "pillow>=11.2.1",
    "patchright~=1.55",
    "tqdm>=4.66.0",
    "trafilatura>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
