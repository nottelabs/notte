[project]
name = "notte-browser"
version = "1.10.2.dev0"
description = "Playwright-based browser sessions: observe pages, execute actions, scrape content"
readme = "README.md"
authors = [
    { name = "Notte Team ", email = "hello@notte.cc" }
]
packages = [
  { include = "notte_browser", from = "src" },
]


requires-python = ">=3.11"
dependencies = [
    "notte_core==1.10.2.dev0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2025.4.15",
    "lxml>=5.3.1",
    "markdownify>=0.14.1",
    "patchright~=1.55",
    "requests>=2.32.3",
    "trafilatura>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
