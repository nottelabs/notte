<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Create a workspace - Tessera</title>
<style>body{font-family:sans-serif;margin:24px;max-width:460px}label{display:block;margin-top:12px}.ok{color:#137333}.bad{color:#b00020}
ul{font-size:14px;padding-left:18px}button[disabled]{opacity:.5}</style></head><body>
<h1>Create a workspace</h1>
<form id="f" action="workspace-done.html" method="get">
  <label for="ws">Workspace name</label><input id="ws" name="ws" autocomplete="off">
  <p id="ws-status" aria-live="polite"></p>
  <label for="pw">Password</label><input id="pw" name="pw" type="password">
  <ul id="rules"><li data-r="len">At least 10 characters</li><li data-r="digit">A number</li><li data-r="sym">A symbol</li></ul>
  <p><button type="submit" id="create" disabled>Create workspace</button></p>
</form>
<script>
// the name is checked 700 ms after typing stops ("taken" or "available"); the button stays disabled until all is valid
const $ = id => document.getElementById(id), TAKEN = ['acme', 'tessera', 'demo'];
let available = false, timer;
$('ws').addEventListener('input', () => {
  available = false; valid(); clearTimeout(timer); $('ws-status').textContent = $('ws').value.trim() ? 'Checking…' : '';
  timer = setTimeout(() => {
    const name = $('ws').value.trim().toLowerCase(); if (!name) return;
    available = !TAKEN.includes(name);
    $('ws-status').textContent = available ? `“${$('ws').value.trim()}” is available.` : `“${$('ws').value.trim()}” is already taken.`;
    $('ws-status').className = available ? 'ok' : 'bad'; valid();
  }, 700);
});
const RULES = {len: v => v.length >= 10, digit: v => /\d/.test(v), sym: v => /[^\w\s]/.test(v)};
$('pw').addEventListener('input', valid);
function valid() {
  let ok = available;
  for (const li of document.querySelectorAll('#rules li')) { const pass = RULES[li.dataset.r]($('pw').value);
    li.className = pass ? 'ok' : 'bad'; li.textContent = li.textContent.replace(/^[✓✗] /, '').replace(/^/, pass ? '✓ ' : '✗ '); ok = ok && pass; }
  $('create').disabled = !ok;
}
</script></body></html>
