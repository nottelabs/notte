<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Create your Fieldnote account</title>
<style>body{font-family:sans-serif;margin:24px;max-width:480px}label{display:block;margin-top:10px}</style></head><body>
<h1>Create your account</h1>
<form action="verify-done.html" method="get">
  <label for="email">Email</label><input id="email" name="email" type="email" required>
  <label for="code">Verification code</label><input id="code" name="code" inputmode="numeric" required>
  <p><small>Your verification code is on the <a href="help-code.html" target="_blank">help page</a> (opens in a new tab).</small></p>
  <button type="submit">Create account</button>
</form></body></html>
