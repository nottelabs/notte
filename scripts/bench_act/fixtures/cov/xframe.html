<!doctype html><html lang="en"><head><meta charset="utf-8"><title>The Weekly Byte - newsletter</title>
<style>body{font-family:sans-serif;margin:24px;max-width:640px}iframe{border:1px solid #ccc;width:100%;height:300px}</style></head><body>
<h1>The Weekly Byte</h1>
<p>Every Friday, the five stories in software that mattered this week. Subscriptions are handled by our partner below.</p>
<iframe id="widget" title="Subscription widget"></iframe>
<script>
// the widget comes from another origin (127.0.0.1 and localhost are different origins), like a payment or newsletter partner
const other = location.hostname === '127.0.0.1' ? 'localhost' : '127.0.0.1';
document.getElementById('widget').src = location.protocol + '//' + other + ':' + location.port +
  location.pathname.replace('xframe.html', 'xframe-widget.html');
</script></body></html>
