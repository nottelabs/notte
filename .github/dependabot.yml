# Dependabot configuration.
#
# Without this file GitHub only runs *security* updates, and it stops touching a
# security PR once a human pushes to its branch. This file turns on regular
# version updates as well, so dependency PRs actually get opened on a schedule.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # Python: the uv workspace (root uv.lock covers every packages/* member).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python:uv"
    groups:
      # One PR per week for all minor/patch bumps. Majors get their own PR.
      python-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      # All security fixes in a single PR.
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  # Node SDK.
  - package-ecosystem: "npm"
    directory: "/node-sdk"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      node-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      node-security:
        applies-to: security-updates
        patterns: ["*"]

  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns: ["*"]
