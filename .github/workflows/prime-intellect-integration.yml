name: Prime Intellect integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/prime-intellect-integration.yml
      - examples/prime-intellect/**
      - packages/notte-core/**
      - packages/notte-sdk/**
      - uv.lock
  push:
    branches: [main]
    paths:
      - .github/workflows/prime-intellect-integration.yml
      - examples/prime-intellect/**
      - packages/notte-core/**
      - packages/notte-sdk/**
      - uv.lock

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.11'
      - run: uv sync --locked && uv pip check && uv run --locked python -m unittest -v test_notte_prime.py
        working-directory: examples/prime-intellect
        env:
          DISABLE_TELEMETRY: 'true'
  browser:
    needs: static
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        sdk: [published, source]
      fail-fast: false
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.11'
      - run: uv sync --locked
        working-directory: examples/prime-intellect
      - if: matrix.sdk == 'source'
        run: |
          uv venv examples/prime-intellect/.source
          uv pip install --python examples/prime-intellect/.source/bin/python -e packages/notte-core -e packages/notte-sdk -e examples/prime-intellect
          uv pip check --python examples/prime-intellect/.source/bin/python
      - uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc
          timeout: '300'
      - name: Verify native MCP, browser ownership, rewards, and cleanup
        working-directory: examples/prime-intellect
        env:
          NOTTE_API_URL: https://us-staging.notte.cc
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
          NOTTE_PRIME_LIVE: '1'
          DISABLE_TELEMETRY: 'true'
          SDK: ${{ matrix.sdk }}
        run: |
          test -n "$NOTTE_API_KEY"
          if [ "$SDK" = source ]; then
            .source/bin/python -m unittest -v test_notte_prime.py
          else
            .venv/bin/python -m unittest -v test_notte_prime.py
          fi
