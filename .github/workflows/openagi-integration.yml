name: OpenAGI integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/openagi-integration.yml
      - examples/openagi/**
      - docs/src/integrations/openagi.mdx
      - packages/notte-sdk/**
      - packages/notte-core/**
      - uv.lock
  push:
    branches: [main]
    paths:
      - .github/workflows/openagi-integration.yml
      - examples/openagi/**
      - docs/src/integrations/openagi.mdx
      - packages/notte-sdk/**
      - packages/notte-core/**
      - uv.lock

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: '3.11'
      - run: uv sync --locked && uv run --locked python -c 'import demo; from oagi import AsyncDefaultAgent'
        working-directory: examples/openagi
      - run: uv run --locked python -m compileall -q demo.py notte_computer.py test_live.py
        working-directory: examples/openagi
  live:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        sdk: [published, source]
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: '3.11'
      - if: matrix.sdk == 'published'
        run: uv sync --locked
        working-directory: examples/openagi
      - if: matrix.sdk == 'source'
        run: uv sync --locked --package notte-sdk --no-dev && uv pip install oagi-core==0.15.3 playwright==1.64.0 && uv pip check
      - uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc
          timeout: '300'
      - name: Verify Lux SDK protocol, browser behavior, and cleanup
        env:
          NOTTE_API_URL: https://us-staging.notte.cc
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
          NOTTE_EXAMPLE_PYTHON: ${{ github.workspace }}/${{ matrix.sdk == 'source' && '.venv' || 'examples/openagi/.venv' }}/bin/python
        run: |
          test -n "$NOTTE_API_KEY"
          "$NOTTE_EXAMPLE_PYTHON" -m unittest test_live -v
        working-directory: examples/openagi
