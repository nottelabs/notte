name: snippets-python-tests

on:
  workflow_call:
    inputs:
      scope:
        description: Suite decisions from the shared push or PR selector.
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Set explicitly, workflow-wide. The SDK falls back to its production base URL
# when this is unset, so a job that only exports NOTTE_API_KEY runs against
# production without saying so - including the cleanup step below, which
# deletes. Matches test-cicd.yml.
env:
  NOTTE_API_URL: "https://us-staging.notte.cc"

jobs:
  changes:
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-2vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 5
    outputs:
      scope: ${{ inputs.scope || steps.scope.outputs.scope }}
    steps:
      - name: Validate supplied scope
        if: inputs.scope != ''
        working-directory: ${{ github.workspace }}
        env:
          SCOPE: ${{ inputs.scope }}
        run: python3 -c 'import json, os; json.loads(os.environ["SCOPE"])'
      - if: inputs.scope == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-scope
        if: inputs.scope == ''
        id: scope

  syntax-check:
    needs: changes
    if: fromJSON(needs.changes.outputs.scope).docs_static
    concurrency:
      group: notte-offline-docs-tests-cicd-syntax-check-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      DOCS_TEST_FAST_MODE: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Create virtual environment
        run: |
          uv venv
          source .venv/bin/activate

      - name: Install dependencies
        run: |
          uv sync --locked
          uv pip install pytest-examples fastapi httpx

      - name: Run syntax checks
        run: cd docs/src && uv run --no-sync pytest -v --tb=no

      - name: Test CLI reference generation
        run: python docs/src/scripts/test_generate_cli_reference.py

      - name: Test shared setup synchronization
        run: python docs/src/scripts/test_sync_quickstart_setup_prompt.py

  type-check:
    needs: changes
    if: fromJSON(needs.changes.outputs.scope).docs_static
    concurrency:
      group: notte-offline-docs-tests-cicd-type-check-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      DOCS_TEST_TYPE_CHECK: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Create virtual environment
        run: |
          uv venv
          source .venv/bin/activate

      - name: Install dependencies
        # Sync the workspace explicitly (what `uv run` would otherwise do on first
        # use), then install mypy into that same environment. Installing mypy first
        # and letting `uv run` sync afterwards is how this job used to lose mypy:
        # the sync downgraded mypy's requirements under it, mypy crashed on import,
        # and every snippet "passed" without being checked.
        run: |
          uv sync --locked
          uv pip install pytest-examples mypy stagehand==4.2.1 openai-agents==0.24.0 claude-agent-sdk==0.2.168 pymongo==4.19.0 fastapi httpx

      - name: Run type checks
        # --no-sync: pytest and the mypy it spawns must see exactly the environment
        # prepared above; nothing may re-sync and alter it.
        run: cd docs/src && uv run --no-sync pytest -v --tb=no

  execution:
    needs: [changes, syntax-check, type-check]
    if: >-
      fromJSON(needs.changes.outputs.scope).docs_live &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      # Scope vault creates to this job only; cleanup deletes only this prefix.
      NOTTE_CI_VAULT_PREFIX: ci-${{ github.run_id }}-${{ github.job }}
    concurrency:
      group: notte-live-api-staging
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/current-head

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Create virtual environment
        run: |
          uv venv
          source .venv/bin/activate

      - name: Install dependencies
        run: |
          uv sync --locked
          uv pip install pytest-examples fastapi httpx

      - name: Install patchright
        run: uv run --no-sync patchright install --no-shell

      - name: Verify environment variables
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_DOCS || secrets.NOTTE_API_KEY }}
        run: |
          if [ -z "$NOTTE_API_KEY" ]; then
            echo "NOTTE_API_KEY is not set"
            exit 1
          fi
          echo "Environment variables are set"

      - name: Wait for the API to be ready
        uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc

      - name: Run execution tests
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_DOCS || secrets.NOTTE_API_KEY }}
          NOTTE_GITHUB_COM_EMAIL: ${{ secrets.NOTTE_GITHUB_COM_EMAIL }}
          NOTTE_GITHUB_COM_PASSWORD: ${{ secrets.NOTTE_GITHUB_COM_PASSWORD }}
          NOTTE_GITHUB_COM_MFA_SECRET: ${{ secrets.NOTTE_GITHUB_COM_MFA_SECRET }}
        run: cd docs/src && uv run --no-sync pytest -v --tb=no

      - name: Cleanup vaults created by this run
        if: always()
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_DOCS || secrets.NOTTE_API_KEY }}
        run: |
          source .venv/bin/activate
          python scripts/cleanup_ci_vaults.py
