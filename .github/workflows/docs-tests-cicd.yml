name: snippets-python-tests

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'packages/**'
      - '.github/workflows/docs-tests-cicd.yml'
      - '.github/actions/wait-for-api/**'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'packages/**'
      - '.github/workflows/docs-tests-cicd.yml'
      - '.github/actions/wait-for-api/**'

# Set explicitly, workflow-wide. The SDK falls back to its production base URL
# when this is unset, so a job that only exports NOTTE_API_KEY runs against
# production without saying so - including the cleanup step below, which
# deletes. Matches test-cicd.yml.
env:
  NOTTE_API_URL: "https://us-staging.notte.cc"

jobs:
  syntax-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      DOCS_TEST_FAST_MODE: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Create virtual environment
        run: |
          uv venv --python 3.11
          source .venv/bin/activate

      - name: Install dependencies
        run: uv pip install notte-sdk pytest-examples

      - name: Run syntax checks
        run: cd docs/src && uv run pytest -v --tb=no

      - name: Test CLI reference generation
        run: python docs/src/scripts/test_generate_cli_reference.py

      - name: Test shared setup synchronization
        run: python docs/src/scripts/test_sync_quickstart_setup_prompt.py

  type-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      DOCS_TEST_TYPE_CHECK: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Create virtual environment
        run: |
          uv venv --python 3.11
          source .venv/bin/activate

      - name: Install dependencies
        # Sync the workspace explicitly (what `uv run` would otherwise do on first
        # use), then install mypy into that same environment. Installing mypy first
        # and letting `uv run` sync afterwards is how this job used to lose mypy:
        # the sync downgraded mypy's requirements under it, mypy crashed on import,
        # and every snippet "passed" without being checked.
        run: |
          uv sync --locked
          uv pip install pytest-examples mypy

      - name: Run type checks
        # --no-sync: pytest and the mypy it spawns must see exactly the environment
        # prepared above; nothing may re-sync and alter it.
        run: cd docs/src && uv run --no-sync pytest -v --tb=no

  execution:
    needs: [syntax-check, type-check]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      # Scope vault creates to this job only; cleanup deletes only this prefix.
      NOTTE_CI_VAULT_PREFIX: ci-${{ github.run_id }}-${{ github.job }}
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Create virtual environment
        run: |
          uv venv --python 3.11
          source .venv/bin/activate

      - name: Install dependencies
        run: uv pip install notte-sdk pytest-examples patchright

      - name: Install patchright
        run: uv run patchright install --no-shell

      - name: Verify environment variables
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_DOCS || secrets.NOTTE_API_KEY }}
        run: |
          if [ -z "$NOTTE_API_KEY" ]; then
            echo "NOTTE_API_KEY is not set"
            exit 1
          fi
          echo "Environment variables are set"

      - name: Wait for the API to be ready
        uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc

      - name: Run execution tests
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_DOCS || secrets.NOTTE_API_KEY }}
          NOTTE_GITHUB_COM_EMAIL: ${{ secrets.NOTTE_GITHUB_COM_EMAIL }}
          NOTTE_GITHUB_COM_PASSWORD: ${{ secrets.NOTTE_GITHUB_COM_PASSWORD }}
          NOTTE_GITHUB_COM_MFA_SECRET: ${{ secrets.NOTTE_GITHUB_COM_MFA_SECRET }}
        run: cd docs/src && uv run pytest -v --tb=no

      - name: Cleanup vaults created by this run
        if: always()
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_DOCS || secrets.NOTTE_API_KEY }}
        run: |
          source .venv/bin/activate
          python scripts/cleanup_ci_vaults.py
