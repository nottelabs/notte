name: Agentcard integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/agentcard-integration.yml
      - examples/agentcard/**
  push:
    branches: [main]
    paths:
      - .github/workflows/agentcard-integration.yml
      - examples/agentcard/**

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/agentcard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  live:
    needs: static
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    defaults:
      run:
        working-directory: examples/agentcard
    env:
      NOTTE_API_URL: https://us-staging.notte.cc
      NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
      NOTTE_AGENTCARD_LIVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - name: Wait for the API
        uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc
          timeout: '300'
      - run: npm run test:live
