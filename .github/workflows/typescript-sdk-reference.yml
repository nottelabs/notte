name: typescript-sdk-reference

on:
  pull_request:
    paths: ['node-sdk/**', 'docs/src/typescript-sdk-reference/**', 'docs/src/snippets/sessions/index.mdx', 'docs/src/testers/sessions/index.*', 'docs/src/docs.json', '.github/workflows/typescript-sdk-reference.yml']
  push:
    branches: [main]
    paths: ['node-sdk/**', 'docs/src/typescript-sdk-reference/**', 'docs/src/snippets/sessions/index.mdx', 'docs/src/testers/sessions/index.*', 'docs/src/docs.json', '.github/workflows/typescript-sdk-reference.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: node-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run docs:test
      - run: npm run docs:check
