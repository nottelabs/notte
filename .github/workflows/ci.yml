name: CI

# One complete diff for every automatic run, with no native path-filter limit.
on:
  push:
    branches: [main]
  # Fork PRs never receive repository secrets. Never use pull_request_target here.
  pull_request:
    branches: [main]

permissions:
  contents: read

# Never cancel a running workflow on a new push: live jobs must finish cleanup.
# Queued live jobs reject obsolete PR heads before dependency installation.
jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-2vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.validation.outputs.scope }}
      selected_scope: ${{ steps.scope.outputs.scope }}
      live_deferred: ${{ steps.validation.outputs.live_deferred }}
      live_authorized: ${{ steps.validation.outputs.live_authorized }}
      llm_provider: ${{ steps.provider.outputs.provider }}
      source_sha: ${{ steps.provider.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # ci:openai selects a provider, not an approval. A full PR rerun requires
      # repository write access and rechecks live metadata for the same head.
      - name: Select live extraction provider
        id: provider
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          DELETED: ${{ github.event.deleted }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          PULLS="$RUNNER_TEMP/ci-provider-pulls.json"
          printf '[]' > "$PULLS"
          if [ "$EVENT_NAME" = pull_request ] && [ "$SAME_REPOSITORY" = true ]; then
            case "$PR_NUMBER" in ''|*[!0-9]*) echo 'Invalid PR number'; exit 1 ;; esac
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.]' > "$PULLS"
          elif [ "$EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$DELETED" != true ]; then
            gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/pulls" \
              --jq '[.[] | . + {merged: (.merged_at != null)}]' > "$PULLS"
          fi
          RESULT=$(python3 scripts/ci_provider.py --event "$EVENT_NAME" --ref "$GITHUB_REF" \
            --repository "$GITHUB_REPOSITORY" --head "$SOURCE_SHA" --attempt "$GITHUB_RUN_ATTEMPT" --pulls "$PULLS")
          printf '%s\n' "$RESULT" | jq -r '"provider=\(.provider)\nsource_sha=\(.source_sha)"' >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/ci-scope
        id: scope
      - name: Plan offline feedback or final live validation
        id: validation
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRUSTED_LIVE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          AUTHORIZATION_STATUSES: ${{ runner.temp }}/live-authorization.json
        run: |
          set -euo pipefail
          printf '[]' > "$AUTHORIZATION_STATUSES"
          if [ "$EVENT_NAME" = pull_request ] && [ "$TRUSTED_LIVE" = true ]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses?per_page=100" > "$AUTHORIZATION_STATUSES"
          fi
          python3 -m scripts.ci_validation plan

  python:
    needs: changes
    if: >-
      fromJSON(needs.changes.outputs.scope).file_checks ||
      fromJSON(needs.changes.outputs.scope).python_static ||
      fromJSON(needs.changes.outputs.scope).python_unit ||
      fromJSON(needs.changes.outputs.scope).python_live ||
      fromJSON(needs.changes.outputs.scope).llm_provider_live ||
      fromJSON(needs.changes.outputs.scope).python_docs ||
      fromJSON(needs.changes.outputs.scope).cli_contract
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/test-cicd.yml
    with:
      scope: ${{ needs.changes.outputs.scope }}
      source_sha: ${{ needs.changes.outputs.source_sha }}
      llm_provider: ${{ needs.changes.outputs.llm_provider }}
      live_authorized: ${{ needs.changes.outputs.live_authorized == 'true' }}
    secrets: inherit # pragma: allowlist secret

  node:
    permissions:
      contents: read
      pull-requests: read
    needs: changes
    if: >-
      fromJSON(needs.changes.outputs.scope).node_static ||
      fromJSON(needs.changes.outputs.scope).node_live ||
      fromJSON(needs.changes.outputs.scope).node_generated
    uses: ./.github/workflows/node-sdk-ci.yml
    with:
      scope: ${{ needs.changes.outputs.scope }}
    secrets: inherit # pragma: allowlist secret

  docs:
    permissions:
      contents: read
      pull-requests: read
    needs: changes
    if: >-
      fromJSON(needs.changes.outputs.scope).docs_static ||
      fromJSON(needs.changes.outputs.scope).docs_live
    uses: ./.github/workflows/docs-tests-cicd.yml
    with:
      scope: ${{ needs.changes.outputs.scope }}
    secrets: inherit # pragma: allowlist secret

  paired:
    permissions:
      contents: read
      pull-requests: read
    needs: changes
    if: >-
      fromJSON(needs.changes.outputs.scope).paired_static ||
      fromJSON(needs.changes.outputs.scope).paired_live
    uses: ./.github/workflows/paired-sdk-examples.yml
    with:
      scope: ${{ needs.changes.outputs.scope }}
    secrets: inherit # pragma: allowlist secret

  readme:
    permissions:
      contents: read
      pull-requests: read
    needs: changes
    if: >-
      fromJSON(needs.changes.outputs.scope).readme_static ||
      fromJSON(needs.changes.outputs.scope).readme_live
    uses: ./.github/workflows/readme-check.yml
    with:
      scope: ${{ needs.changes.outputs.scope }}
    secrets: inherit # pragma: allowlist secret

  # Preserve the required check name and wait for all selected suite families.
  tests:
    needs: [changes, python, node, docs, paired, readme]
    if: always()
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-2vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/current-head
      - name: Check suite results and required live validation
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -m scripts.ci_validation gate
