name: Laminar integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/laminar-integration.yml
      - examples/laminar/**
      - packages/notte-sdk/**
      - packages/notte-core/**
      - node-sdk/**
      - uv.lock
  push:
    branches: [main]
    paths:
      - .github/workflows/laminar-integration.yml
      - examples/laminar/**
      - packages/notte-sdk/**
      - packages/notte-core/**
      - node-sdk/**
      - uv.lock

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.11'
      - run: uv sync --locked && uv run --locked python -m unittest -v test_read_page.py
        working-directory: examples/laminar
      - run: npm ci && npm run typecheck && npm run test:live
        working-directory: examples/laminar/typescript
  browser:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        sdk: [published, source]
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.11'
      - run: uv sync --locked
        working-directory: examples/laminar
      - if: matrix.sdk == 'source'
        run: uv pip install --python examples/laminar/.venv/bin/python -e packages/notte-core -e packages/notte-sdk
      - run: uv pip check --python examples/laminar/.venv/bin/python
      - run: npm ci && npm run typecheck
        working-directory: examples/laminar/typescript
      - if: matrix.sdk == 'source'
        run: npm ci --prefix node-sdk && npm run build --prefix node-sdk
      - if: matrix.sdk == 'source'
        run: npm install --no-save --package-lock=false ../../../node-sdk && npm run typecheck
        working-directory: examples/laminar/typescript
      - uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc
          timeout: '300'
      - name: Verify traces and owned browser cleanup in both languages
        env:
          NOTTE_API_URL: https://us-staging.notte.cc
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
          LMNR_PROJECT_API_KEY: ${{ secrets.LMNR_PROJECT_API_KEY }}
          NOTTE_LAMINAR_LIVE: '1'
          NOTTE_LAMINAR_EXPORT_LIVE: ${{ secrets.LMNR_PROJECT_API_KEY != '' && '1' || '0' }}
          DISABLE_TELEMETRY: 'true'
        run: |
          test -n "$NOTTE_API_KEY"
          examples/laminar/.venv/bin/python -m unittest discover -v -s examples/laminar -p test_read_page.py
          cd examples/laminar/typescript
          npm run test:live
