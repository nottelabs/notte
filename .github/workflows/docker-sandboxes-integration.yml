name: Docker Sandboxes integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/docker-sandboxes-integration.yml
      - examples/docker-sandboxes/**
  push:
    branches: [main]
    paths:
      - .github/workflows/docker-sandboxes-integration.yml
      - examples/docker-sandboxes/**

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/docker-sandboxes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: sh -n setup.sh
      - name: Verify the native CLI contract without creating a sandbox
        run: |
          curl -fsSL https://github.com/docker/sbx-releases/releases/download/v0.48.0/DockerSandboxes-linux-amd64.tar.gz -o "$RUNNER_TEMP/sbx.tar.gz"
          echo "609a2e4b881ba9a7fd21543077e53d3b863a6b99eebee1f208e51a097ab56a05  $RUNNER_TEMP/sbx.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/sbx.tar.gz" -C "$RUNNER_TEMP"
          node check-cli.mjs "$RUNNER_TEMP/docker-sbx/sbx"
  live:
    needs: static
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    defaults:
      run:
        working-directory: examples/docker-sandboxes
    env:
      NOTTE_API_URL: https://us-staging.notte.cc
      NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
      NOTTE_SANDBOXES_LIVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - name: Require the Notte test key
        run: test -n "$NOTTE_API_KEY"
      - name: Wait for the API
        uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc
          timeout: '300'
      - run: npm run test:live
