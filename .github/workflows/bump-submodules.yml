name: bump-submodules

# Every day, fast-forward each submodule in this repository to the latest commit
# on its default branch, then open (and auto-merge) a pull request with the bumps.
# main is protected, so the bumps land through a PR and the required checks, not
# through a direct push.

on:
  schedule:
    - cron: '0 5 * * *' # daily at 05:00 UTC
  workflow_dispatch: # allow manual triggering

concurrency:
  group: bump-submodules
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The CLI reference is generated from notte-cli, so it rides along with every
  # bump instead of drifting behind it. Generating runs notte-cli's code, so it
  # happens here, in a job that holds no write token; the bump job pins
  # notte-cli to the commit generated from and commits the result.
  cli-reference:
    if: github.repository == 'nottelabs/notte'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.cli.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the latest notte-cli
        id: cli
        run: |
          git submodule update --init --remote notte-cli
          echo "sha=$(git -C notte-cli rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: notte-cli/go.mod
          cache-dependency-path: notte-cli/go.sum

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Generate the CLI reference
        run: python3 docs/src/scripts/generate_cli_reference.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-reference
          path: |
            docs/src/cli-reference/
            docs/src/docs.json
            docs/src/llms.txt
          if-no-files-found: error

  bump:
    if: github.repository == 'nottelabs/notte'
    needs: cli-reference
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      BRANCH: chore/bump-submodules
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULE_BUMP_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward submodules
        id: bump
        env:
          CLI_SHA: ${{ needs.cli-reference.outputs.sha }}
        run: |
          set -euo pipefail

          # Every submodule declared in .gitmodules, in path order.
          PATHS=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '{print $2}' | sort)

          echo "Tracking submodules:"
          echo "$PATHS" | sed 's/^/  - /'

          for sub in $PATHS; do
            git submodule update --init "$sub"
            git -C "$sub" fetch --quiet origin
            # Prefer the repository's main branch, fall back to its default branch.
            if git -C "$sub" rev-parse --verify --quiet origin/main >/dev/null; then
              target=origin/main
            else
              target=$(git -C "$sub" symbolic-ref --quiet --short refs/remotes/origin/HEAD || echo origin/main)
            fi
            # notte-cli stays at the commit the CLI reference was generated from.
            if [ "$sub" = notte-cli ]; then
              target=$CLI_SHA
            fi
            git -C "$sub" checkout --quiet --detach "$target"
            echo "  $sub -> $(git -C "$sub" rev-parse --short HEAD) ($target)"
          done

          git add -- $PATHS

          if git diff --cached --quiet -- $PATHS; then
            echo "All submodules are already up to date."
            echo "changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changes=true" >> "$GITHUB_OUTPUT"

          # Compact "Subproject commit X -> Y" summary for the pull request body.
          {
            echo 'summary<<SUMMARY_EOF'
            git -c core.pager=cat diff --cached --submodule=short -- $PATHS
            echo SUMMARY_EOF
          } >> "$GITHUB_OUTPUT"

      # Cleared first, so a page for a removed command group does not survive.
      - name: Clear the CLI reference
        if: steps.bump.outputs.changes == 'true'
        run: rm -rf docs/src/cli-reference

      - name: Download the CLI reference
        if: steps.bump.outputs.changes == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-reference
          path: docs/src

      - name: Stage the CLI reference
        if: steps.bump.outputs.changes == 'true'
        run: git add -A -- docs/src/cli-reference docs/src/docs.json docs/src/llms.txt

      - name: Open or update the bump pull request
        if: steps.bump.outputs.changes == 'true'
        env:
          # The same token as the checkout, so the push and the pull request come
          # from a real account and the PR therefore runs CI.
          GH_TOKEN: ${{ secrets.SUBMODULE_BUMP_PAT }}
          SUMMARY: ${{ steps.bump.outputs.summary }}
        run: |
          set -euo pipefail

          DATE=$(date -u +%Y-%m-%d)
          TITLE="chore: bump submodules to latest upstream"
          BODY=$(printf '%s\n\n%s\n\n```\n%s\n```\n\n%s\n' \
            "Automated daily bump of every submodule in this repository to the latest commit on its default branch." \
            "Updated $DATE (UTC):" \
            "$SUMMARY" \
            "Opened by .github/workflows/bump-submodules.yml. Merges automatically once the required checks pass.")

          # Always rebuild the branch from the current main so it stays mergeable.
          git checkout -B "$BRANCH"
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"

          PR_NUMBER=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            echo "Updating existing PR #$PR_NUMBER"
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$BODY"
          else
            PR_NUMBER=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY" \
              | sed -n 's|.*pull/\([0-9]*\).*|\1|p' | head -1)
            echo "Created PR #$PR_NUMBER"
          fi

          echo "PR: https://github.com/${{ github.repository }}/pull/$PR_NUMBER"

          # main requires one approving review, so the pull request sits at
          # mergeStateStatus BLOCKED and --auto would park there forever. This
          # token's account is exempt server side, but `gh pr merge` refuses a
          # BLOCKED pull request client side, before it ever calls the API.
          # --admin skips only that local guard; the merge itself is ordinary.
          #
          # Merging the pull request this job just created, by number, is also
          # what keeps the merge safe: nothing is looked up by branch name, so a
          # fork branch cannot impersonate this automation.
          for _ in $(seq 1 10); do
            if gh pr checks "$PR_NUMBER" >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for checks to be reported on PR #$PR_NUMBER."
            sleep 30
          done

          if gh pr checks "$PR_NUMBER" --watch --fail-fast --interval 30; then
            gh pr merge "$PR_NUMBER" --squash --delete-branch --admin
            echo "Merged PR #$PR_NUMBER."
          else
            echo "::error::Checks did not pass on PR #$PR_NUMBER, so it was left open. The next scheduled run rebuilds the branch from main and retries."
            exit 1
          fi
