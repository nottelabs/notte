name: Evervault integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/evervault-integration.yml
      - examples/evervault/**
  push:
    branches: [main]
    paths:
      - .github/workflows/evervault-integration.yml
      - examples/evervault/**

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.11'
      - run: uv sync --locked && uv run pytest -q
        working-directory: examples/evervault/python
      - run: npm ci && npm run typecheck && npm test
        working-directory: examples/evervault/typescript
  browser:
    needs: static
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.11'
      - run: uv sync --locked
        working-directory: examples/evervault/python
      - run: npm ci
        working-directory: examples/evervault/typescript
      - uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-dev.notte.cc
          timeout: '300'
      - name: Verify native browser control and unknown-profile refusal
        env:
          NOTTE_API_URL: https://us-dev.notte.cc
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
          NOTTE_EVERVAULT_LIVE: '1'
        run: |
          test -n "$NOTTE_API_KEY"
          (cd examples/evervault/python && uv run pytest -x -q)
          (cd examples/evervault/typescript && npm run test:live)
