name: Val Town integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/valtown-integration.yml
      - examples/valtown/**
  push:
    branches: [main]
    paths:
      - .github/workflows/valtown-integration.yml
      - examples/valtown/**

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npx --yes deno@2.9.6 fmt --check main.ts main_test.ts deno.json
        working-directory: examples/valtown
      - run: npx --yes deno@2.9.6 lint main.ts main_test.ts
        working-directory: examples/valtown
      - run: npx --yes deno@2.9.6 task check && npx --yes deno@2.9.6 task test
        working-directory: examples/valtown
  browser:
    needs: static
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc
          timeout: '300'
      - name: Verify native Deno browser work and cleanup
        working-directory: examples/valtown
        env:
          NOTTE_API_URL: https://us-staging.notte.cc
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
          NOTTE_VALTOWN_LIVE: '1'
        run: npx --yes deno@2.9.6 task test:live
