name: Box integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/box-integration.yml
      - examples/box/**
  push:
    branches: [main]
    paths:
      - .github/workflows/box-integration.yml
      - examples/box/**

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/box
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_upload
      - run: python -m compileall -q main.py test_box.py test_capture.py
  live:
    needs: static
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    defaults:
      run:
        working-directory: examples/box
    env:
      NOTTE_API_URL: https://us-staging.notte.cc
      NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
      NOTTE_BOX_CAPTURE_LIVE: '1'
      NOTTE_BOX_LIVE: '1'
      BOX_ACCESS_TOKEN: ${{ secrets.BOX_ACCESS_TOKEN }}
      BOX_FOLDER_ID: ${{ vars.BOX_FOLDER_ID || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r requirements.txt
      - name: Wait for the API
        uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc
          timeout: '300'
      - run: python -m unittest -v test_capture
      - run: npm run test:capture
      - name: Test an optional live Box account
        if: env.BOX_ACCESS_TOKEN != ''
        run: |
          python -m unittest -v test_box
          npm run test:live
