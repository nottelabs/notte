name: act bench

# The act / choose / check benchmark (scripts/bench_act) on local fixture pages and public sites, head against
# base. Pass/fail rules: scripts/bench_act/rules.py. Runs on PRs labelled `act-bench` or changing observe or act,
# and on demand. Forks get no secrets: the benchmark is skipped.
on:
  workflow_dispatch:
    inputs:
      head_ref:
        description: Branch, tag or SHA to bench
        required: true
        default: main
      base_ref:
        description: Branch, tag or SHA to compare against (empty = head alone)
        default: ''
      suites:
        description: Comma-separated suites (empty = all), e.g. fixtures,demo,real
        default: ''
      runners:
        description: Task and probe runners (notte-local, notte-local-llm, notte-local-html, probe-local-jev, probe-local-llm; *-scripted = no model, timing only)
        default: notte-local,probe-local-jev
      repeats:
        description: Runs per task and probe page (1-5)
        default: '1'
      shards:
        description: Parallel jobs (1-8)
        default: '4'
  # SECURITY: pull_request, never pull_request_target: fork PRs run without secrets and skip.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  # A new push cancels the PR's previous run; adding an unrelated label does not.
  group: >-
    act-bench-${{ github.event.pull_request.number || github.run_id }}-${{
    github.event.action == 'labeled' && github.event.label.name != 'act-bench' && github.run_id || 'bench' }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-2vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      head: ${{ steps.plan.outputs.head }}
      base: ${{ steps.plan.outputs.base }}
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      suites: ${{ steps.plan.outputs.suites }}
      runners: ${{ steps.plan.outputs.runners }}
      repeats: ${{ steps.plan.outputs.repeats }}
    steps:
      - name: Decide whether to run, and on which commits
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          PR: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ inputs.head_ref }}
          BASE_REF: ${{ inputs.base_ref }}
          SUITES: ${{ inputs.suites }}
          RUNNERS: ${{ inputs.runners || 'notte-local,probe-local-jev' }}
          REPEATS: ${{ inputs.repeats || '1' }}
          SHARDS: ${{ inputs.shards || '4' }}
        run: |
          set -euo pipefail
          # Paths that change what observe shows or what act does.
          paths='^(packages/notte-browser/src/notte_browser/(js|dom)/|packages/notte-core/src/notte_core/act/|packages/notte-llm/src/notte_llm/act\.py$|scripts/bench_act/|\.github/workflows/act-bench\.yml$)'
          run=false
          if [ "$EVENT" = workflow_dispatch ]; then
            run=true
          elif [ "$ACTION" = labeled ]; then
            if [ "$LABEL" = act-bench ]; then run=true; fi
          elif jq -e 'index("act-bench")' <<<"$PR_LABELS" >/dev/null; then
            run=true
          else
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
            if grep -qE "$paths" <<<"$files"; then run=true; fi
          fi
          # the scripted runners (no model) are the only ones that run without the key
          needs_key=false
          if tr ',' '\n' <<<"$RUNNERS" | grep -qvE '(^$|-scripted$)'; then needs_key=true; fi
          if [ "$run" = true ] && [ "$needs_key" = true ] && [ "$HAS_KEY" != true ]; then
            if [ "$FORK" != true ]; then
              echo "::error::the OPENROUTER_API_KEY repository secret is not set"
              exit 1
            fi
            echo "act bench skipped: fork PRs get no secrets (OPENROUTER_API_KEY)." | tee -a "$GITHUB_STEP_SUMMARY"
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          [ "$run" = true ] || exit 0

          [[ "$SUITES" =~ ^[a-z0-9,_-]*$ && "$RUNNERS" =~ ^[a-z0-9,-]+$ ]] || { echo "::error::bad suites or runners"; exit 1; }
          [[ "$REPEATS" =~ ^[1-5]$ && "$SHARDS" =~ ^[1-8]$ ]] || { echo "::error::repeats must be 1-5 and shards 1-8"; exit 1; }
          sha() { gh api "repos/$GITHUB_REPOSITORY/commits/$1" --jq .sha; }
          if [ "$EVENT" = workflow_dispatch ]; then
            head=$(sha "$HEAD_REF")
            base=""
            if [ -n "$BASE_REF" ]; then base=$(sha "$BASE_REF"); fi
          else
            head=$PR_HEAD
            base=$(gh api "repos/$GITHUB_REPOSITORY/compare/$PR_BASE...$PR_HEAD" --jq .merge_base_commit.sha)
          fi
          {
            echo "head=$head"
            echo "base=$base"
            echo "shards=$(jq -cn --argjson n "$SHARDS" '[range(1; $n + 1)]')"
            echo "shard_count=$SHARDS"
            echo "suites=$SUITES"
            echo "runners=$RUNNERS"
            echo "repeats=$REPEATS"
          } >> "$GITHUB_OUTPUT"
          echo "act bench: head $head, base ${base:-none}, $SHARDS shard(s)" | tee -a "$GITHUB_STEP_SUMMARY"

  bench:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-4vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      DISABLE_TELEMETRY: "true"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Check out head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}
          path: head
          persist-credentials: false

      - name: Check out base
        if: needs.plan.outputs.base != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.base }}
          path: base
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "*/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: head/.python-version

      - name: Cache patchright
        id: cache-patchright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-patchright-${{ hashFiles('head/uv.lock') }}-v2
          restore-keys: |
            ${{ runner.os }}-patchright-${{ hashFiles('head/uv.lock') }}-
            ${{ runner.os }}-patchright-

      - name: Install head and base
        env:
          HAS_BASE: ${{ needs.plan.outputs.base != '' }}
          CACHE_HIT: ${{ steps.cache-patchright.outputs.cache-hit }}
        run: |
          set -euo pipefail
          trees=(head)
          if [ "$HAS_BASE" = true ]; then trees+=(base); fi
          for tree in "${trees[@]}"; do
            (cd "$tree" && uv sync --all-extras --no-dev)
          done
          if [ "$CACHE_HIT" != true ]; then
            (cd head && uv run --no-sync patchright install --with-deps chromium --no-shell)
          fi
          if [ "$HAS_BASE" = true ]; then
            # a no-op when base pins the same patchright as head
            (cd base && uv run --no-sync patchright install chromium --no-shell)
          fi

      - name: Run shard ${{ matrix.shard }}/${{ needs.plan.outputs.shard_count }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HAS_BASE: ${{ needs.plan.outputs.base != '' }}
          SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.shard_count }}
          SUITES: ${{ needs.plan.outputs.suites }}
          RUNNERS: ${{ needs.plan.outputs.runners }}
          REPEATS: ${{ needs.plan.outputs.repeats }}
        run: |
          trees=(--tree head=head)
          if [ "$HAS_BASE" = true ]; then trees=(--tree base=base --tree head=head); fi
          python head/scripts/bench_act/bench.py "${trees[@]}" --shard "$SHARD" --concurrency 4 \
            --runners "$RUNNERS" --suites "$SUITES" --repeats "$REPEATS" --out runs

      - name: Upload shard runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: act-bench-shard-${{ matrix.shard }}
          path: runs
          if-no-files-found: error

  report:
    needs: [plan, bench]
    if: always() && needs.plan.outputs.run == 'true'
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-2vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 10
    steps:
      - name: Check out the harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}
          path: head
          sparse-checkout: scripts/bench_act
          persist-credentials: false

      - name: Download shard runs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: act-bench-shard-*
          path: runs
          merge-multiple: true

      - name: Report and apply the pass/fail rules
        env:
          BENCH_RESULT: ${{ needs.bench.result }}
        run: |
          status=0
          python3 head/scripts/bench_act/report.py runs --summary summary.md --check || status=$?
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$BENCH_RESULT" != success ]; then
            echo "::error::a bench shard job ended with '$BENCH_RESULT'"
            status=1
          fi
          exit "$status"

      - name: Upload the merged runs and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: act-bench-report
          path: |
            summary.md
            runs
          if-no-files-found: warn
