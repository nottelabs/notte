name: nightly-test-release

on:
  schedule:
    - cron: '0 16 * * *'  # Run at 4 PM every day
  workflow_dispatch:  # Allow manual triggering


env:
  CACHE_TYPE: "pip"
  DISABLE_TELEMETRY: "true"

jobs:
  example-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      SLACK_NIGHTLY_WEBHOOK_URL: ${{ secrets.SLACK_NIGHTLY_WEBHOOK_URL }}
    steps:
      - name: Generate timestamp
        id: timestamp
        run: echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
            enable-cache: true
            cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"
          cache: ${{ env.CACHE_TYPE }}

      - name: Run test release
        id: test_release
        env:
          NOTTE_RELEASE_TEST_API_KEY: ${{ secrets.NOTTE_RELEASE_TEST_API_KEY }}
        run: bash scripts/test_release.sh
        continue-on-error: true

      - name: Prepare error message
        if: steps.test_release.outcome == 'failure' && env.SLACK_NIGHTLY_WEBHOOK_URL != ''
        env:
          RUN_TIMESTAMP: ${{ steps.timestamp.outputs.timestamp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PYCODE'
          import json
          import os
          import re
          from pathlib import Path

          summary = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", os.environ.get("TEST_OUTPUT", ""))
          payload = {
              "username": f"GitHub Nightly Release Pipeline ({os.environ['RUN_TIMESTAMP']})",
              "text": f"❌ Nightly Release Pipeline FAILED: <{os.environ['RUN_URL']}|View Pipeline Run>\n```\n{summary[:12000]}\n```",
          }
          Path("slack-payload.json").write_text(json.dumps(payload))
          PYCODE

      - name: Send Slack Notification on Failure
        if: steps.test_release.outcome == 'failure' && env.SLACK_NIGHTLY_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ env.SLACK_NIGHTLY_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: slack-payload.json

      - name: Propagate release test failure
        if: steps.test_release.outcome == 'failure'
        run: exit 1
