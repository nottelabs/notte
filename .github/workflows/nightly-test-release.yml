name: nightly-test-release

on:
  schedule:
    - cron: '0 16 * * *'  # Run at 4 PM every day
  workflow_dispatch:  # Allow manual triggering


env:
  CACHE_TYPE: "pip"
  DISABLE_TELEMETRY: "true"

jobs:
  example-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Generate timestamp
        id: timestamp
        run: echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
            enable-cache: true
            cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: ${{ env.CACHE_TYPE }}

      - name: Run test release
        id: test_release
        env:
          NOTTE_RELEASE_TEST_API_KEY: ${{ secrets.NOTTE_RELEASE_TEST_API_KEY }}
        run: bash scripts/test_release.sh
        continue-on-error: true

      - name: Prepare error message
        if: steps.test_release.outcome == 'failure'
        id: error_msg
        run: |
          # Escape quotes and backslashes for JSON
          ERROR_MSG=$(echo "$TEST_OUTPUT" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g' | tr '\n' ' ')
          echo "escaped_error=$ERROR_MSG" >> $GITHUB_OUTPUT

      - name: Send Slack Notification on Failure
        if: steps.test_release.outcome == 'failure'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_NIGHTLY_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "username": "GitHub Nightly Release Pipeline (${{ steps.timestamp.outputs.timestamp }})",
              "text": "❌ Nightly Release Pipeline FAILED: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Pipeline Run>\n```\n${{ steps.error_msg.outputs.escaped_error }}\n```"
            }
