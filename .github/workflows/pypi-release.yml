name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_TYPE: "pip"
  DISABLE_TELEMETRY: "true"

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Build python dist
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
            enable-cache: true
            cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version-file: ".python-version"
            cache: ${{ env.CACHE_TYPE }}

      - name: Build Python distributions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash build.sh "$RELEASE_TAG"

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: >-
          uv publish
          --check-url https://pypi.org/simple
          dist/*

      - name: Wait for PyPI indexing
        run: |
          echo "Waiting for PyPI to index packages..."
          sleep 180  # Wait 3 minutes for PyPI indexing

      - name: Install the package from PyPI
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv venv pypi
          source pypi/bin/activate

          # Retry installation with exponential backoff. --refresh bypasses
          # uv's cached copy of the PyPI index (served with max-age=600),
          # which the publish step's --check-url primed before the upload.
          max_attempts=3
          attempt=1
          wait_time=60

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts: Installing notte==${RELEASE_TAG}..."
            if uv pip install --refresh "notte==${RELEASE_TAG}"; then
              echo "Installation successful!"
              break
            fi

            if [ $attempt -lt $max_attempts ]; then
              echo "Installation failed, waiting ${wait_time}s before retry..."
              sleep $wait_time
              wait_time=$((wait_time * 2))  # Exponential backoff
            else
              echo "All installation attempts failed"
              exit 1
            fi
            attempt=$((attempt + 1))
          done

          uv pip show notte
          uv pip show notte-core
          uv pip show notte-sdk
          uv pip show notte-browser
          uv pip show notte-agent

  deploy-docs:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    name: Trigger Mintlify docs deployment
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Trigger Mintlify deployment
        env:
          MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.mintlify.com/v1/project/update/67325cb675ec6a1a358ff41d" \
            -H "Authorization: Bearer ${MINTLIFY_API_KEY}")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Mintlify deployment trigger failed with status $http_code"
            exit 1
          fi

          echo "Mintlify docs deployment queued successfully"

  next-development-version:
    needs: build
    name: Open next Python development version PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: next-python-development-version
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Advance workspace version and lockfile
        run: |
          python3 scripts/release_version.py next "$RELEASE_TAG"
          if ! git diff --quiet -- pyproject.toml packages/; then
            uv lock
          fi

      - name: Open version bump pull request
        env:
          # Scope the existing automation PAT to repository writes so PR checks run.
          GH_TOKEN: ${{ secrets.SUBMODULE_BUMP_PAT }}
        run: |
          set -euo pipefail
          if git diff --quiet -- pyproject.toml packages/ uv.lock; then
            echo "The development version is already ahead of this release."
            exit 0
          fi

          NEXT_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          BRANCH="chore/python-version-after-${RELEASE_TAG}"
          TITLE="chore: advance Python packages to ${NEXT_VERSION}"
          PR=$(gh pr list --head "$BRANCH" --base "$BASE_BRANCH" --state all --json url --jq '.[0].url // empty')
          if [ -n "$PR" ]; then
            echo "A bump PR already exists for this release: $PR"
            exit 0
          fi

          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Recover a push that succeeded before PR creation failed on an earlier run.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Reusing the existing branch $BRANCH"
          else
            git checkout -b "$BRANCH"
            git add pyproject.toml packages/*/pyproject.toml uv.lock
            git commit -m "$TITLE"
            git push origin "$BRANCH"
          fi
          BODY_FILE="$RUNNER_TEMP/python-version-pr.md"
          printf 'After publishing %s, advance all Python workspace packages and internal pins to %s.\n\nThe lockfile is refreshed with uv lock. This PR is left open for review and CI.\n' \
            "$RELEASE_TAG" "$NEXT_VERSION" > "$BODY_FILE"
          gh pr create --base "$BASE_BRANCH" --head "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE"
