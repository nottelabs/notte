name: bump-python-sdk-types

# Refresh the Python SDK's OpenAPI snapshot from staging and regenerate the wire
# models under notte_sdk/_generated. If they drifted, open (or refresh) one pull
# request. Unlike bump-node-sdk this never merges by itself: a schema change can
# change public notte_sdk.types, so a human reviews it.
# See docs/design/openapi-generated-sdk-types.md.

on:
  schedule:
    # Same cadence as bump-node-sdk. GitHub cron is UTC.
    - cron: '0 5 * * *'
    - cron: '30 10 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

concurrency:
  group: bump-python-sdk-types
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    if: github.repository == 'nottelabs/notte'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BRANCH: chore/bump-python-sdk-types
      NOTTE_API_URL: https://us-staging.notte.cc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.SUBMODULE_BUMP_PAT }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Wait for the API to be reachable
        # The staging API scales to zero when idle and wakes on the first request.
        run: |
          deadline=$((SECONDS + 900))
          until [ "$(curl -s -o /dev/null --max-time 20 -w '%{http_code}' "$NOTTE_API_URL/health")" = "200" ]; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "API not reachable after 15 minutes"; exit 1; }
            sleep 10
          done

      - name: Refresh the snapshot and regenerate
        run: make sdk-types-fetch SDK_TYPES_URL="$NOTTE_API_URL"

      - name: Detect drift
        id: drift
        run: |
          set -euo pipefail
          git add -A -- packages/notte-sdk/openapi packages/notte-sdk/src/notte_sdk/_generated
          if git diff --cached --quiet; then
            echo "The Python SDK types are up to date with staging."
            echo "changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changes=true" >> "$GITHUB_OUTPUT"
          git diff --cached --stat

      - name: Validate the regenerated types
        # Report, don't block: a failing check is exactly what the reviewer needs to see on the PR.
        if: steps.drift.outputs.changes == 'true'
        id: validate
        continue-on-error: true
        run: |
          uv run --no-sync pre-commit run basedpyright --all-files
          uv run --no-sync pytest -q -p no:cacheprovider tests/sdk/test_generated_types.py tests/sdk/test_types.py tests/sdk/test_dict_types.py

      - name: Open or update the pull request
        if: steps.drift.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_BUMP_PAT }}
          VALIDATION: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TITLE="chore(sdk): regenerate Python SDK types from staging OpenAPI"
          REPORT=$(uv run --no-sync python scripts/sdk_types_drift_report.py)
          BODY=$(printf '%s\n\n%s\n\n%s\n\n```\n%s\n```\n' \
            "Automated refresh of \`packages/notte-sdk/openapi/openapi.json\` and \`notte_sdk/_generated\` from $NOTTE_API_URL ($(date -u '+%Y-%m-%d %H:%M UTC'))." \
            "Typecheck and SDK type tests: **$VALIDATION**. Review changes to public \`notte_sdk.types\` before merging; this PR is never merged automatically." \
            "Remaining drift in hand-written models:" \
            "$REPORT")

          git checkout -B "$BRANCH"
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"

          PR_NUMBER=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi
