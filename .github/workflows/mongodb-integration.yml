name: MongoDB integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mongodb-integration.yml
      - docs/src/testers/integrations/mongodb.*
      - docs/package.json
      - docs/package-lock.json
      - node-sdk/test/mongodb.integration.test.ts
      - node-sdk/src/**
      - node-sdk/package.json
      - node-sdk/package-lock.json
      - node-sdk/tsconfig.json
      - node-sdk/tsup.config.ts
      - packages/notte-sdk/**
      - packages/notte-core/**
      - uv.lock
  push:
    branches: [main]
    paths:
      - .github/workflows/mongodb-integration.yml
      - docs/src/testers/integrations/mongodb.*
      - docs/package.json
      - docs/package-lock.json
      - node-sdk/test/mongodb.integration.test.ts
      - node-sdk/src/**
      - node-sdk/package.json
      - node-sdk/package-lock.json
      - node-sdk/tsconfig.json
      - node-sdk/tsup.config.ts
      - packages/notte-sdk/**
      - packages/notte-core/**
      - uv.lock

permissions:
  contents: read

jobs:
  live:
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    services:
      mongodb:
        image: mongo:8.0@sha256:6657bf2413fefc5be649390318f5b4cd7328e982722f8ce2ac6dfa6f0a42cb03
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --memory 768m --cpus 1
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NOTTE_API_URL: https://us-staging.notte.cc
      MONGODB_URI: mongodb://127.0.0.1:27017
      NOTTE_MONGODB_LIVE: '1'
      VITEST_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv sync --locked --package notte-sdk --no-dev
      - run: uv pip install pymongo==4.19.0
      - run: npm ci --prefix node-sdk
      - run: npm ci --prefix docs
      - run: npm run build --prefix node-sdk
      - name: Wait for the API
        uses: ./.github/actions/wait-for-api
        with:
          api-url: ${{ env.NOTTE_API_URL }}
          timeout: '300'
      - name: Verify persistence and database failure cleanup
        working-directory: node-sdk
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
        run: |
          export NOTTE_DOCS_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"
          npx vitest run test/mongodb.integration.test.ts
