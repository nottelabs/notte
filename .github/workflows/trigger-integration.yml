name: Trigger.dev integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/trigger-integration.yml
      - examples/trigger/**
      - node-sdk/src/**
      - node-sdk/package.json
      - node-sdk/package-lock.json
      - node-sdk/tsup.config.ts
      - node-sdk/tsconfig.json
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-integration.yml
      - examples/trigger/**
      - node-sdk/src/**
      - node-sdk/package.json
      - node-sdk/package-lock.json
      - node-sdk/tsup.config.ts
      - node-sdk/tsconfig.json

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
        working-directory: examples/trigger
      - run: npm run typecheck
        working-directory: examples/trigger
      - run: npm test
        working-directory: examples/trigger
  browser-handler:
    needs: static
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sdk: [published, source]
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
        working-directory: examples/trigger
      - if: matrix.sdk == 'source'
        run: |
          npm ci --prefix node-sdk
          npm run build --prefix node-sdk
          cd examples/trigger
          npm install --no-save --package-lock=false ../../node-sdk
      - name: Wait for the API
        uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc
          timeout: '300'
      - name: Check browser handler success and failure cleanup
        working-directory: examples/trigger
        env:
          NOTTE_API_URL: https://us-staging.notte.cc
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
          NOTTE_TRIGGER_LIVE: '1'
        run: |
          test -n "$NOTTE_API_KEY"
          npm run typecheck
          npm test
          npm run test:live
