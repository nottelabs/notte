name: stale-pr-nudge

# Pings the author of an open, ready-for-review pull request that has had no
# activity for 7 days (scripts/stale_pr_nudge.sh). At most once per idle
# stretch: a PR whose latest activity is already the ping is skipped.

on:
  schedule:
    - cron: '0 8 * * 1-5' # weekdays at 08:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List the PRs that would be pinged without commenting'
        type: boolean
        default: true
  pull_request:
    paths:
      - '.github/workflows/stale-pr-nudge.yml'
      - 'scripts/stale_pr_nudge.sh'
      - 'scripts/test_stale_pr_nudge.sh'

permissions: {}

concurrency:
  group: stale-pr-nudge-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/test_stale_pr_nudge.sh

  nudge:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ping authors of idle pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STALE_DAYS: 7
          MARKER: '<!-- stale-pr-nudge -->'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: bash scripts/stale_pr_nudge.sh
