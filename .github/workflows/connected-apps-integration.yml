name: Connected apps integration

on:
  pull_request:
    paths:
      - 'examples/connected-apps/**'
      - 'docs/src/integrations/connected-apps.mdx'
      - '.github/workflows/connected-apps-integration.yml'
  push:
    branches: [main]
    paths:
      - 'examples/connected-apps/**'
      - 'docs/src/integrations/connected-apps.mdx'
      - '.github/workflows/connected-apps-integration.yml'

permissions:
  contents: read

concurrency:
  group: connected-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: python -m unittest -v
        working-directory: examples/connected-apps
      - run: npm test
        working-directory: examples/connected-apps
