name: cleanup-ci-vaults

# Manual / scheduled orphan drain only. Do NOT run delete-all from every PR —
# dozens of parallel CI jobs share this API key and would race each other.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List vaults without deleting"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      min_age_hours:
        description: "Only delete ephemeral-named vaults at least this many hours old"
        required: false
        default: "2"
        type: string
  schedule:
    # Daily drain of leaked default/pytest vaults older than 2h.
    - cron: "0 5 * * *"

jobs:
  cleanup:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY }}
      DISABLE_TELEMETRY: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install notte-sdk
        run: uv pip install --system notte-sdk

      - name: Cleanup orphaned CI vaults
        run: |
          MIN_AGE="${{ github.event.inputs.min_age_hours || '2' }}"
          ARGS=(--min-age-hours "$MIN_AGE")
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python scripts/cleanup_ci_vaults.py "${ARGS[@]}"
