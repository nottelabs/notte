name: Pipedream integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/pipedream-integration.yml
      - examples/pipedream/**
      - docs/src/integrations/pipedream.mdx
      - packages/notte-sdk/**
      - packages/notte-core/**
      - node-sdk/src/**
      - node-sdk/package.json
      - node-sdk/package-lock.json
      - uv.lock
  push:
    branches: [main]
    paths:
      - .github/workflows/pipedream-integration.yml
      - examples/pipedream/**
      - docs/src/integrations/pipedream.mdx
      - packages/notte-sdk/**
      - packages/notte-core/**
      - node-sdk/src/**
      - node-sdk/package.json
      - node-sdk/package-lock.json
      - uv.lock

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: uv sync --locked && uv run --locked python -c 'import demo'
        working-directory: examples/pipedream
      - run: npm ci && npm run typecheck
        working-directory: examples/pipedream
  live:
    needs: static
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: [published, source]
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - if: matrix.sdk == 'published'
        run: uv sync --locked
        working-directory: examples/pipedream
      - if: matrix.sdk == 'source'
        run: uv sync --locked --package notte-sdk --no-dev && uv pip install --python .venv/bin/python mcp==2.3.0 httpx2==2.13.1
      - run: npm ci
        working-directory: examples/pipedream
      - if: matrix.sdk == 'source'
        run: npm ci --prefix node-sdk && npm run build --prefix node-sdk
      - if: matrix.sdk == 'source'
        run: npm install --no-save --package-lock=false ../../node-sdk
        working-directory: examples/pipedream
      - uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc
          timeout: '300'
      - name: Verify native protocols, owned browsers, and cleanup
        env:
          NOTTE_API_URL: https://us-staging.notte.cc
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
          NOTTE_EXAMPLE_PYTHON: ${{ github.workspace }}/${{ matrix.sdk == 'source' && '.venv' || 'examples/pipedream/.venv' }}/bin/python
        run: |
          test -n "$NOTTE_API_KEY" || { echo 'Set the Notte CI API key'; exit 1; }
          "$NOTTE_EXAMPLE_PYTHON" -m unittest test_live -v
          npm test
        working-directory: examples/pipedream
