name: fx integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/fx-integration.yml
      - examples/fx/**
      - node-sdk/**
  push:
    branches: [main]
    paths:
      - .github/workflows/fx-integration.yml
      - examples/fx/**
      - node-sdk/**

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci && npm run typecheck && npm test
        working-directory: examples/fx
  browser:
    needs: static
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        sdk: [published, source]
      fail-fast: false
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci && npm run typecheck
        working-directory: examples/fx
      - if: matrix.sdk == 'source'
        run: npm ci --prefix node-sdk && npm run build --prefix node-sdk
      - if: matrix.sdk == 'source'
        run: npm install --no-save --package-lock=false ../../node-sdk && npm run typecheck
        working-directory: examples/fx
      - uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc
          timeout: '300'
      - name: Verify native engine tool execution and owned browser cleanup
        run: |
          test -n "$NOTTE_API_KEY"
          npm test
        working-directory: examples/fx
        env:
          NOTTE_FX_LIVE: '1'
          NOTTE_API_URL: https://us-staging.notte.cc
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
