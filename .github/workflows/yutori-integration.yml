name: Yutori integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/yutori-integration.yml
      - examples/yutori/**
      - packages/notte-sdk/**
      - packages/notte-core/**
      - uv.lock
  push:
    branches: [main]
    paths:
      - .github/workflows/yutori-integration.yml
      - examples/yutori/**
      - packages/notte-sdk/**
      - packages/notte-core/**
      - uv.lock

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/yutori
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q main.py test_protocol.py test_browser.py
      - run: python -m unittest test_protocol -v
  live:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        sdk: [published, source]
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    defaults:
      run:
        working-directory: examples/yutori
    env:
      NOTTE_API_URL: https://us-staging.notte.cc
      NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
      NOTTE_YUTORI_LIVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - if: matrix.sdk == 'published'
        run: pip install -r requirements.txt
      - if: matrix.sdk == 'source'
        run: pip install ../../packages/notte-core ../../packages/notte-sdk yutori==0.9.36 playwright==1.63.0
      - run: pip check
      - name: Require the Notte test key
        run: test -n "$NOTTE_API_KEY"
      - name: Wait for the API
        uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc
          timeout: '300'
      - run: python -m unittest test_protocol test_browser -v
