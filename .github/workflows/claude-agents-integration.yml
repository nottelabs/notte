name: Claude Agent SDK integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/claude-agents-integration.yml
      - docs/src/testers/integrations/claude_agents.*
      - docs/package.json
      - docs/package-lock.json
      - node-sdk/test/claude-agents.integration.test.ts
      - node-sdk/src/**
      - node-sdk/package.json
      - node-sdk/package-lock.json
      - node-sdk/tsconfig.json
      - node-sdk/tsup.config.ts
      - packages/notte-sdk/**
      - packages/notte-core/**
      - uv.lock
  push:
    branches: [main]
    paths:
      - .github/workflows/claude-agents-integration.yml
      - docs/src/testers/integrations/claude_agents.*
      - docs/package.json
      - docs/package-lock.json
      - node-sdk/test/claude-agents.integration.test.ts
      - node-sdk/src/**
      - node-sdk/package.json
      - node-sdk/package-lock.json
      - node-sdk/tsconfig.json
      - node-sdk/tsup.config.ts
      - packages/notte-sdk/**
      - packages/notte-core/**
      - uv.lock

permissions:
  contents: read

jobs:
  live:
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    env:
      NOTTE_API_URL: https://us-staging.notte.cc
      NOTTE_CLAUDE_AGENTS_LIVE: '1'
      VITEST_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv sync --locked --package notte-sdk --no-dev
      - run: uv pip install claude-agent-sdk==0.2.168 && uv pip check
      - run: npm ci --prefix node-sdk
      - run: npm ci --prefix docs
      - run: npm run build --prefix node-sdk
      - name: Wait for the API
        uses: ./.github/actions/wait-for-api
        with:
          api-url: ${{ env.NOTTE_API_URL }}
          timeout: '300'
      - name: Execute recipes and framework failure cleanup
        working-directory: node-sdk
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
          # Provider credentials run only on the reviewed main branch.
          ANTHROPIC_API_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          : "${NOTTE_API_KEY:?The Claude Agent SDK live tests require the CI test key}"
          export NOTTE_DOCS_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"
          npx vitest run test/claude-agents.integration.test.ts
