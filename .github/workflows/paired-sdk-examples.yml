name: paired-sdk-examples

on:
  workflow_call:
    inputs:
      scope:
        description: Suite decisions from the shared push or PR selector.
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-2vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 5
    outputs:
      scope: ${{ inputs.scope || steps.scope.outputs.scope }}
    steps:
      - name: Validate supplied scope
        if: inputs.scope != ''
        working-directory: ${{ github.workspace }}
        env:
          SCOPE: ${{ inputs.scope }}
        run: python3 -c 'import json, os; json.loads(os.environ["SCOPE"])'
      - if: inputs.scope == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-scope
        if: inputs.scope == ''
        id: scope

  checks:
    needs: changes
    if: fromJSON(needs.changes.outputs.scope).paired_static
    concurrency:
      group: notte-offline-paired-sdk-examples-checks-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: node-sdk/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: npm ci --prefix node-sdk
      - run: npm ci --prefix docs
      - run: npm run build --prefix node-sdk
      - run: npm run typecheck --prefix node-sdk
      - run: node docs/src/sniptest/check_typescript.mjs
      - run: node --test docs/src/sniptest/test_typescript_display.mjs
      - run: python docs/src/sniptest/live.py
      - name: Install MySQL guide test dependencies
        run: python -m pip install requests 'pydantic>=2,<3' fastapi httpx
      - run: python -m unittest discover -s docs/src/sniptest -p 'test_*.py'
      - run: python docs/src/sniptest/generate.py --check
      - run: python docs/src/scripts/check_docs_nav.py
      - run: python -m unittest discover -s docs/src/scripts -p 'test_*.py'
      - name: Enforce example parity and shrinking backlog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != '0000000000000000000000000000000000000000' ]; then
            python docs/src/sniptest/parity.py --base-ref "$BASE_SHA"
          else
            python docs/src/sniptest/parity.py
          fi

  native-checks:
    needs: changes
    if: fromJSON(needs.changes.outputs.scope).paired_static && toJSON(fromJSON(needs.changes.outputs.scope).integration_examples) != '[]'
    concurrency:
      group: notte-offline-paired-sdk-examples-native-checks-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.shard }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: native-checks (${{ matrix.shard }})
    strategy:
      fail-fast: false
      max-parallel: 6
      # Bound total jobs independently of the PR's registry or selector output.
      # The runner distributes every selected example across these six shards.
      matrix:
        shard: ['1/6', '2/6', '3/6', '4/6', '5/6', '6/6']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/current-head
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: contains(fromJSON(needs.changes.outputs.scope).integration_examples, 'terraform-profiles')
        with:
          go-version-file: integrations/terraform-provider-notte/go.mod
          cache-dependency-path: integrations/terraform-provider-notte/go.sum
      - name: Check native integration examples
        env:
          INTEGRATION_EXAMPLES: ${{ toJSON(fromJSON(needs.changes.outputs.scope).integration_examples) }}
        run: python3 scripts/ci_integration_examples.py checks --shard "${{ matrix.shard }}"

  live:
    needs: changes
    # Test same-repository PRs before merging; forks must not receive staging credentials.
    if: >-
      fromJSON(needs.changes.outputs.scope).paired_live &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: live (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.scope).paired_matrix }}
    env:
      NOTTE_API_URL: https://us-staging.notte.cc
      NOTTE_DOCS_LIVE: '1'
      NOTTE_DOCS_SHARD: ${{ matrix.shard }}
      VITEST_INTEGRATION: '1'
    # Shards own disjoint examples and resources. Each takes one of six slot queues
    # shared by all refs, so at most six run against staging at once,
    # and they no longer wait for the other live suites.
    concurrency:
      group: notte-paired-live-staging-${{ matrix.slot }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Do not restore dependency caches into the credentialed job.
      - uses: ./.github/actions/current-head

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: contains(fromJSON(needs.changes.outputs.scope).integration_examples, 'terraform-profiles')
        with:
          go-version-file: integrations/terraform-provider-notte/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv sync --locked --package notte-sdk --no-dev
      - run: uv pip install playwright==1.62.0 patchright==1.55.1
      - name: Verify Python browser dependencies before live execution
        run: .venv/bin/python -c "import playwright.sync_api; import patchright.sync_api"
      - run: npm ci --prefix node-sdk
      - run: npm run build --prefix node-sdk
      - name: Wait for the API to be ready
        uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc

      - name: Execute both languages against the local SDK packages
        if: fromJSON(needs.changes.outputs.scope).paired_snippets_live
        working-directory: node-sdk
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
        run: |
          export NOTTE_DOCS_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"
          # Retry a failed live example once, without rerunning the whole suite.
          # A second failure still fails this job; other jobs keep their retry policy.
          npx vitest run test/docs-snippets.integration.test.ts --retry 1

      - name: Execute native integration examples
        if: >-
          github.actor != 'dependabot[bot]' ||
          contains(fromJSON(needs.changes.outputs.scope).integration_examples, 'inngest') ||
          contains(fromJSON(needs.changes.outputs.scope).integration_examples, 'temporal')
        env:
          INTEGRATION_EXAMPLES: ${{ toJSON(fromJSON(needs.changes.outputs.scope).integration_examples) }}
          INTEGRATION_SOURCE_ONLY: ${{ toJSON(fromJSON(needs.changes.outputs.scope).integration_source_only || fromJSON('[]')) }}
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
          OPENAI_API_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANTHROPIC_API_KEY || '' }}
          NOTTE_DEEPAGENTS_MODEL_LIVE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANTHROPIC_API_KEY != '' && '1' || '0' }}
          GEMINI_API_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.GEMINI_API_KEY || '' }}
          BRAINTRUST_API_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && contains(fromJSON(needs.changes.outputs.scope).integration_examples, 'braintrust') && secrets.BRAINTRUST_API_KEY || '' }}
          BRAINTRUST_PROJECT: notte-integration-tests
          LMNR_PROJECT_API_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && contains(fromJSON(needs.changes.outputs.scope).integration_examples, 'laminar') && secrets.LMNR_PROJECT_API_KEY || '' }}
          NOTTE_LAMINAR_EXPORT_LIVE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && contains(fromJSON(needs.changes.outputs.scope).integration_examples, 'laminar') && secrets.LMNR_PROJECT_API_KEY != '' && '1' || '0' }}
        run: python3 scripts/ci_integration_examples.py live --shard "$NOTTE_DOCS_SHARD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-browser-ownership
          path: ${{ runner.temp }}/agent-browser-owned.jsonl
          if-no-files-found: ignore

  agent-models:
    needs: changes
    if: >-
      fromJSON(needs.changes.outputs.scope).paired_live &&
      (contains(fromJSON(needs.changes.outputs.scope).integration_examples, 'openai-agents') ||
      contains(fromJSON(needs.changes.outputs.scope).integration_examples, 'claude-agents')) &&
      github.actor != 'dependabot[bot]' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: agent-models (${{ matrix.recipe }})
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(contains(fromJSON(needs.changes.outputs.scope).integration_examples, 'openai-agents') && contains(fromJSON(needs.changes.outputs.scope).integration_examples, 'claude-agents') && '["openai-agents","claude-agents"]' || contains(fromJSON(needs.changes.outputs.scope).integration_examples, 'openai-agents') && '["openai-agents"]' || '["claude-agents"]') }}
    concurrency:
      group: notte-live-api-staging
      queue: max
      cancel-in-progress: false
    env:
      NOTTE_API_URL: https://us-staging.notte.cc
      INTEGRATION_EXAMPLES: ${{ format('["{0}"]', matrix.recipe) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/current-head

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Prepare agent dependencies without credentials
        run: python3 scripts/ci_integration_examples.py prepare-agent
      - name: Run both agent languages through OpenRouter
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 scripts/ci_integration_examples.py test-agent
