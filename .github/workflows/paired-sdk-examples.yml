name: paired-sdk-examples

on:
  workflow_call:
    inputs:
      scope:
        description: Suite decisions from the shared push or PR selector.
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-2vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 5
    outputs:
      scope: ${{ inputs.scope || steps.scope.outputs.scope }}
    steps:
      - name: Validate supplied scope
        if: inputs.scope != ''
        working-directory: ${{ github.workspace }}
        env:
          SCOPE: ${{ inputs.scope }}
        run: python3 -c 'import json, os; json.loads(os.environ["SCOPE"])'
      - if: inputs.scope == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-scope
        if: inputs.scope == ''
        id: scope

  checks:
    needs: changes
    if: fromJSON(needs.changes.outputs.scope).paired_static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node-sdk/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: npm ci --prefix node-sdk
      - run: npm ci --prefix docs
      - run: npm run build --prefix node-sdk
      - run: npm run typecheck --prefix node-sdk
      - run: node docs/src/sniptest/check_typescript.mjs
      - run: node --test docs/src/sniptest/test_typescript_display.mjs
      - run: python docs/src/sniptest/live.py
      - run: python -m unittest discover -s docs/src/sniptest -p 'test_*.py'
      - run: python docs/src/sniptest/generate.py --check
      - run: python docs/src/scripts/check_docs_nav.py
      - run: python -m unittest discover -s docs/src/scripts -p 'test_*.py'
      - name: Enforce example parity and shrinking backlog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != '0000000000000000000000000000000000000000' ]; then
            python docs/src/sniptest/parity.py --base-ref "$BASE_SHA"
          else
            python docs/src/sniptest/parity.py
          fi

  live:
    needs: [changes, checks]
    # Test same-repository PRs before merging; forks must not receive staging credentials.
    if: >-
      fromJSON(needs.changes.outputs.scope).paired_live &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [1, 2]
    env:
      NOTTE_API_URL: https://us-staging.notte.cc
      NOTTE_DOCS_LIVE: '1'
      NOTTE_DOCS_SHARD: ${{ matrix.shard }}/2
      VITEST_INTEGRATION: '1'
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Do not restore dependency caches into the credentialed job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv sync --locked --package notte-sdk --no-dev
      - run: uv pip install playwright==1.62.0 patchright==1.55.1
      - name: Verify Python browser dependencies before live execution
        run: .venv/bin/python -c "import playwright.sync_api; import patchright.sync_api"
      - run: npm ci --prefix node-sdk
      - run: npm run build --prefix node-sdk
      - name: Wait for the API to be ready
        uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc

      - name: Execute both languages against the local SDK packages
        working-directory: node-sdk
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
        run: |
          export NOTTE_DOCS_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"
          # Retry a failed live example once, without rerunning the whole suite.
          # A second failure still fails this job; other jobs keep their retry policy.
          npx vitest run test/docs-snippets.integration.test.ts --retry 1
