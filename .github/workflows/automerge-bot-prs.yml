name: automerge-bot-prs

# Completes the hands-off loop for the scheduled automation branches.
#
# main requires one approving review. A bypass allowance lets a permitted user
# merge without that review, but GitHub does not extend the bypass to the
# auto-merge queue, so `gh pr merge --auto` leaves those pull requests parked at
# REVIEW_REQUIRED forever. Performing the merge explicitly with the same token
# does honour the bypass, so this workflow merges the automation pull requests
# once their required checks have passed.
#
# Only the branches listed in BOT_BRANCHES are ever merged here, and the merge
# still goes through gh, so any unsatisfied branch protection rule blocks it.

on:
  workflow_run:
    workflows: ["pytest cicd"]
    types: [completed]

concurrency:
  group: automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  merge:
    # Only for a green run on one of the automation branches.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.head_branch == 'chore/bump-submodules' ||
       github.event.workflow_run.head_branch == 'chore/refresh-llms')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.SUBMODULE_BUMP_PAT }}
      GH_REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Merge the automation pull request
        run: |
          set -euo pipefail

          PR_NUMBER=$(gh pr list --head "$HEAD_BRANCH" --base main --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open pull request for $HEAD_BRANCH, nothing to merge."
            exit 0
          fi

          echo "Found PR #$PR_NUMBER for $HEAD_BRANCH."

          # pytest cicd is the only required check, but the other reporters are
          # often still running when it finishes. Give them a few minutes to
          # settle rather than failing the merge on a transient BLOCKED state.
          for attempt in $(seq 1 10); do
            STATE=$(gh pr view "$PR_NUMBER" --json state --jq '.state')
            if [ "$STATE" = "MERGED" ]; then
              echo "PR #$PR_NUMBER is already merged."
              exit 0
            fi
            if [ "$STATE" != "OPEN" ]; then
              echo "::warning::PR #$PR_NUMBER is $STATE, not merging."
              exit 0
            fi

            if gh pr merge "$PR_NUMBER" --squash --delete-branch; then
              echo "Merged PR #$PR_NUMBER."
              exit 0
            fi

            echo "Merge attempt $attempt failed, waiting for checks to settle."
            sleep 30
          done

          # Not a failure worth paging on: the scheduled job rebuilds the branch
          # from main on its next run, which produces a fresh pull request.
          echo "::warning::Could not merge PR #$PR_NUMBER after 10 attempts. It stays open for manual merge."
