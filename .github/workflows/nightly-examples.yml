name: nightly-examples

on:
  schedule:
    - cron: '0 6 * * *'  # Run at 6 AM every day
  workflow_dispatch:  # Allow manual triggering
    inputs:
      test_filter:
        description: "Filter legacy/README tests on any ref; registered static checks run on all refs, registered live checks on main"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CACHE_TYPE: "pip"
  DISABLE_TELEMETRY: "true"
  CREDIT_CARD_HOLDER: "Marcel Pagnol"
  CREDIT_CARD_NUMBER: 4242424242424242
  CREDIT_CARD_CVV: 777
  CREDIT_CARD_EXPIRATION: "05/28"
  NOTTE_CI_VAULT_PREFIX: ci-${{ github.run_id }}-${{ github.job }}

jobs:
  registered-examples:
    # Scheduled/manual selection runs the complete registry with its existing
    # dependencies, entrypoints, SDK legs, shards, and staging credentials.
    uses: ./.github/workflows/paired-sdk-examples.yml
    secrets: inherit # pragma: allowlist secret

  example-tests:
    needs: registered-examples
    # Run after integration failures on any dispatch ref, but do not start work after cancellation.
    if: ${{ !cancelled() }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 75
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    env:
      NOTTE_API_URL: https://us-staging.notte.cc
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
            enable-cache: true
            cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: ${{ env.CACHE_TYPE }}

      - name: Install dependencies
        run: uv sync --locked --dev --all-extras

      - name: Use HTTPS Ubuntu mirrors on Blacksmith
        run: |
          # Canonical's archive/security endpoints intermittently fail from
          # Blacksmith over both HTTP and HTTPS. Prefer kernel.org's Ubuntu
          # mirror, with the official archive as fallback, for every suite.
          # Preserve suites (including noble-security) and Ubuntu signing keys.
          sudo python3 - <<'PY'
          from pathlib import Path
          import re

          apt = Path('/etc/apt')
          mirror_list = apt / 'blacksmith-ubuntu-mirrors.txt'
          mirror_list.write_text(
              'https://mirrors.edge.kernel.org/ubuntu\tpriority:1\n'
              'https://archive.ubuntu.com/ubuntu\tpriority:2\n')
          sources = [apt / 'sources.list']
          sources += list((apt / 'sources.list.d').glob('*.list'))
          sources += list((apt / 'sources.list.d').glob('*.sources'))
          for source in sources:
              if source.is_file():
                  source.write_text(re.sub(
                      r'https?://(?:(?:[a-z0-9-]+\.)*archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?(?=\s|$)',
                      f'mirror+file:{mirror_list}', source.read_text()))
          PY
          # Bound each network wait and reject stale indexes after an error.
          sudo tee /etc/apt/apt.conf.d/99-ci-network > /dev/null <<'EOF'
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::Retries "2";
          APT::Update::Error-Mode "any";
          EOF

      - name: Install patchright
        timeout-minutes: 5
        run: |
          uv run patchright install --with-deps chromium --no-shell

      - name: Verify environment variables
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
        run: |
          if [ -z "$NOTTE_API_KEY" ]; then
            echo "NOTTE_API_KEY is not set"
            exit 1
          fi
          echo "Environment variables are set"

      - name: Run legacy and README example tests
        env:
          EXAMPLE_TEST_FILTER: ${{ inputs.test_filter || '' }}
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
        run: xvfb-run --auto-servernum bash tests/run_examples.sh -k "$EXAMPLE_TEST_FILTER"

      - name: Cleanup vaults created by this run
        if: always()
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
        run: uv run python scripts/cleanup_ci_vaults.py

      - name: Capture legacy example summary
        id: summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          summary_path = Path("pytest_summary.log")
          summary = summary_path.read_text() if summary_path.exists() else "Example summary unavailable. See the workflow logs."
          summary = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", summary)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f"summary={json.dumps(summary[:12000])}\n")
          PY

  report:
    needs: [registered-examples, example-tests]
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Generate timestamp
        id: timestamp
        if: always()
        run: echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Build Slack notification
        if: always()
        env:
          RUN_TIMESTAMP: ${{ steps.timestamp.outputs.timestamp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REGISTERED_RESULT: ${{ needs.registered-examples.result }}
          LEGACY_RESULT: ${{ needs.example-tests.result }}
          SUMMARY_JSON: ${{ needs.example-tests.outputs.summary }}
          REGISTERED_LIVE_ENABLED: ${{ github.ref == 'refs/heads/main' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          encoded_summary = os.environ['SUMMARY_JSON']
          summary = json.loads(encoded_summary) if encoded_summary else "Example summary unavailable. See the workflow logs."
          live = "enabled" if os.environ['REGISTERED_LIVE_ENABLED'] == 'true' else "main only; not run on this ref"
          payload = {
              "username": f"GitHub Nightly Pipeline ({os.environ['RUN_TIMESTAMP']})",
              "text": (
                  f"Pipeline results: {os.environ['RUN_URL']}\n"
                  f"Registered integrations: {os.environ['REGISTERED_RESULT']} (live staging checks: {live})\n"
                  f"Legacy and README examples (staging): {os.environ['LEGACY_RESULT']}\n"
                  f"```\n{summary[:12000]}\n```"
              ),
          }
          Path("slack-payload.json").write_text(json.dumps(payload))
          PY

      - name: Send Slack Notification
        if: always()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_NIGHTLY_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: slack-payload.json
