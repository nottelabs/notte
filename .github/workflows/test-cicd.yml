name: pytest cicd

on:
  workflow_call:
    inputs:
      scope:
        description: Suite decisions from the shared push or PR selector.
        type: string
        default: ''
  # Periodic full live coverage; offline tests remain the secret-free PR gate.
  schedule:
    - cron: '0 */4 * * 1-5'
  # SECURITY: Automatic runs use pull_request in ci.yml, never pull_request_target.
  # Forks receive no secrets. Dispatch runs the reviewed PR's code WITH secrets.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run the FULL secret-backed CI on. For external (fork) PRs, only dispatch after reviewing the diff - this runs the contributor''s code with our secrets.'
        required: true

concurrency:
  # PR runs share a group so a new push cancels the superseded run. Every other run (main
  # pushes, manual runs) gets its own group so none is cancelled or replaced while queued.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CACHE_TYPE: "pip"
  NOTTE_API_URL: "https://us-staging.notte.cc"
  DISABLE_TELEMETRY: "true"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
  # True for push, manual dispatch, and same-repo PRs; false for fork PRs. Steps that
  # need secrets are gated on this so fork PRs skip them cleanly instead of failing.
  IS_TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
  # Scope vault creates to this workflow job; cleanup deletes only this prefix.
  NOTTE_CI_VAULT_PREFIX: ci-${{ github.run_id }}-${{ github.job }}

permissions:
  contents: read
  pull-requests: write

jobs:
  # Scheduled and manual runs select locally; automatic runs reuse the caller scope.
  changes:
    permissions:
      contents: read
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-2vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 5
    outputs:
      scope: ${{ inputs.scope || steps.scope.outputs.scope }}
    steps:
      - name: Validate supplied scope
        if: inputs.scope != ''
        working-directory: ${{ github.workspace }}
        env:
          SCOPE: ${{ inputs.scope }}
        run: python3 -c 'import json, os; json.loads(os.environ["SCOPE"])'
      - name: Checkout code
        if: inputs.scope == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-scope
        if: inputs.scope == ''
        id: scope

  checks:
    needs: changes
    if: fromJSON(needs.changes.outputs.scope).file_checks
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-4vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 15
    steps:
      - name: Checkout PR code (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Maintainer-only path: runs the dispatched PR's code WITH secrets. Only reach
          # this after reviewing the diff. refs/pull/<n>/head is the PR's head commit.
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout code (PR or push)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/python-setup
        if: fromJSON(needs.changes.outputs.scope).python_static || fromJSON(needs.changes.outputs.scope).lint_all
        with:
          pre-commit: "true"

      - name: Set up standalone file checks
        if: >-
          (github.event_name == 'push' || github.event_name == 'pull_request') &&
          !fromJSON(needs.changes.outputs.scope).python_static && !fromJSON(needs.changes.outputs.scope).lint_all
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Run pre-commit
        env:
          FULL: ${{ fromJSON(needs.changes.outputs.scope).lint_all }}
          BASE_SHA: ${{ fromJSON(needs.changes.outputs.scope).base }}
          HEAD_SHA: ${{ fromJSON(needs.changes.outputs.scope).head }}
          DOCS_LINKS: ${{ fromJSON(needs.changes.outputs.scope).docs_links }}
          PYTHON_SETUP: ${{ fromJSON(needs.changes.outputs.scope).python_static || fromJSON(needs.changes.outputs.scope).lint_all }}
        run: |
          if [ "$PYTHON_SETUP" = true ]; then
            runner=(uv run --active pre-commit)
          else
            runner=(uvx --from pre-commit==4.6.2 pre-commit)
          fi
          if [ "$FULL" = true ]; then
            "${runner[@]}" run --all-files
          else
            "${runner[@]}" run --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA"
            if [ "$DOCS_LINKS" = true ]; then
              "${runner[@]}" run check-docs-broken-links --all-files
            fi
          fi

      - name: Note - secret-backed tests skipped (fork PR)
        if: ${{ env.IS_TRUSTED != 'true' }}
        run: |
          echo "This is a fork PR. Steps that require secrets (Vertex auth + the pytest suite)"
          echo "were skipped - fork PRs intentionally have no access to repository secrets."
          echo "Build, install, and pre-commit (lint + type checks) ran above and reflect your change."
          echo "A maintainer can run the full secret-backed suite after reviewing the diff via"
          echo "'Run workflow' (workflow_dispatch) with this PR number."

  # The offline suite: every test not marked `staging` or `live` (see the markers in
  # pyproject.toml). Offline - a local browser and localhost only, no secrets - so it runs on
  # fork PRs too and cannot be failed by a third-party website or a staging deploy.
  tests:
    needs: changes
    if: fromJSON(needs.changes.outputs.scope).python_unit
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout PR code (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Maintainer-only path: runs the dispatched PR's code WITH secrets. Only reach
          # this after reviewing the diff. refs/pull/<n>/head is the PR's head commit.
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head

      - name: Checkout code (PR or push)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/python-setup
        with:
          browsers: "true"
          pre-commit: "true"

      - name: Run unit tests
        run: |
          set -o pipefail
          make test-cicd | tee pytest-coverage.txt

      - name: Note - staging-and-live skipped (fork PR)
        if: ${{ env.IS_TRUSTED != 'true' }}
        run: |
          echo "This is a fork PR. The staging-and-live job (Notte API + third-party websites)"
          echo "was skipped - fork PRs intentionally have no access to repository secrets."
          echo "Pre-commit and the offline unit suite ran above and reflect your change."
          echo "A maintainer can run staging-and-live after reviewing the diff via"
          echo "'Run workflow' (workflow_dispatch) with this PR number."

      - name: Pytest coverage comment
        # Fork PRs get a read-only token, so they cannot post the comment.
        if: ${{ always() && fromJSON(needs.changes.outputs.scope).python_unit && github.ref != 'refs/heads/main' && env.IS_TRUSTED == 'true' }}
        uses: MishaKav/pytest-coverage-comment@9ee59af31bd7bcada1cc496f086b407122602dbd # v1.12.3
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml

  # Everything marked `staging` (Notte API, us-staging) or `live` (third-party websites, LLM
  # providers), including marked tests outside tests/integration. These depend on
  # services outside this repo, so failures are retried (`make test-live`) and the job is kept
  # separate from the `tests` gate - do not make it a required check.
  staging-and-live:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.scope).python_live && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [1, 2]
    env:
      NOTTE_TEST_SHARD: ${{ matrix.shard }}/2
      NOTTE_CI_VAULT_PREFIX: ci-${{ github.run_id }}-${{ github.job }}-${{ matrix.shard }}
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout PR code (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Maintainer-only path: runs the dispatched PR's code WITH secrets. Only reach
          # this after reviewing the diff. refs/pull/<n>/head is the PR's head commit.
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head

      - name: Checkout code (PR or push)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            ref: ${{ github.event.pull_request.head.sha }}

      # Mint credentials at the deployment boundary; notte-llm only receives a bearer token.
      - id: 'auth'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.VERTEX_AI }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
            enable-cache: true
            cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: ${{ env.CACHE_TYPE }}

      - name: Cache patchright
        id: cache-patchright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-patchright-${{ hashFiles('**/uv.lock') }}-v2
          restore-keys: |
            ${{ runner.os }}-patchright-${{ hashFiles('**/uv.lock') }}-
            ${{ runner.os }}-patchright-

      - name: Install dependencies
        run: uv sync --dev --all-extras

      - name: Install patchright
        if: steps.cache-patchright.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss - installing patchright"
          uv run patchright install --with-deps chromium --no-shell

      - name: Verify environment variables
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_PY || secrets.NOTTE_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          if [ -z "$NOTTE_API_KEY" ]; then
            echo "NOTTE_API_KEY is not set. For an external/fork PR, a maintainer should review the diff and run this workflow via 'Run workflow' (workflow_dispatch) with the PR number."
            exit 1
          fi
          # The SMTP test (tests/integration/sdk/test_persona_inbox.py) skips itself without these, so only warn.
          for name in SMTP_SERVER EMAIL_SENDER EMAIL_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not set, the SMTP test will be skipped"
            fi
          done
          echo "Environment variables are set"

      - name: Wait for the API to be ready
        uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc

      - name: Configure compatible LLM endpoint
        run: uv run --script .github/scripts/configure_llm.py

      - name: Run staging and live tests
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_PY || secrets.NOTTE_API_KEY }}
          NOTTE_VAULT_TEST_EMAIL: ${{ secrets.NOTTE_VAULT_TEST_EMAIL }}
          NOTTE_VAULT_TEST_PASSWORD: ${{ secrets.NOTTE_VAULT_TEST_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: make test-live PYTEST_LIVE='uv run pytest -n 2 tests -m "staging or live" --ignore=tests/examples/test_examples.py --ignore=tests/examples/test_readme.py'

      - name: Cleanup vaults created by this run
        if: ${{ always() }}
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_PY || secrets.NOTTE_API_KEY }}
        run: uv run python scripts/cleanup_ci_vaults.py

  cli-contract:
    needs: changes
    if: fromJSON(needs.changes.outputs.scope).cli_contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, store: file }
          - { os: ubuntu-24.04, store: secret-service }
          - { os: macos-15, store: "" }
          - { os: windows-2025, store: "" }
    name: cli-contract (${{ matrix.os }}${{ matrix.store && format(', {0}', matrix.store) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NOTTE_CLI_CONTRACT: "1"
      NOTTE_CLI_CONTRACT_STORE: ${{ matrix.store }}
      # Password of the throwaway keychain the macOS job creates.
      NOTTE_CLI_CONTRACT_KEYCHAIN_PASSWORD: ci # pragma: allowlist secret
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout PR code (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head
          persist-credentials: false

      - name: Checkout code (PR or push)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - run: git submodule update --init notte-cli

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: notte-cli/go.mod
          cache-dependency-path: notte-cli/go.sum

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Use a dedicated, unlocked default keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p "$NOTTE_CLI_CONTRACT_KEYCHAIN_PASSWORD" notte-ci.keychain
          security set-keychain-settings notte-ci.keychain
          security unlock-keychain -p "$NOTTE_CLI_CONTRACT_KEYCHAIN_PASSWORD" notte-ci.keychain
          security list-keychains -d user -s notte-ci.keychain
          security default-keychain -d user -s notte-ci.keychain

      - name: Install a Secret Service
        if: matrix.store == 'secret-service'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus
          # Creating a collection needs an interactive prompt, so provide the
          # collection the CLI uses up front, as an unencrypted keyring.
          mkdir -p ~/.local/share/keyrings
          printf '[keyring]\ndisplay-name=notte-cli\nctime=0\nmtime=0\nlock-on-idle=false\nlock-after=false\n' \
            > ~/.local/share/keyrings/notte-cli.keyring

      - name: Run the contract test
        run: |
          cmd="uv run --isolated --no-project --python 3.11 \
            --with-editable ./packages/notte-core --with-editable ./packages/notte-sdk --with pytest --with pytest-timeout \
            pytest tests/sdk/test_cli_keyring_contract.py --noconftest -p no:cacheprovider -v -rs"
          if [ "$NOTTE_CLI_CONTRACT_STORE" = secret-service ]; then
            dbus-run-session -- bash -c "echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null && $cmd"
          else
            $cmd
          fi

  # Docs assertions need neither the SDK workspace nor cloud credentials.
  docs:
    permissions:
      contents: read
    needs: changes
    # Manual runs already execute these assertions in the full unit suite.
    if: >-
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      fromJSON(needs.changes.outputs.scope).python_docs
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-2vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir pytest pyyaml
      - run: python -m pytest -c /dev/null --rootdir=. tests/docs tests/test_generate_llms_offline.py --noconftest -q
