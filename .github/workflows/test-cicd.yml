name: pytest cicd

on:
  push:
    branches:
      - main
  # SECURITY: Use `pull_request`, never `pull_request_target`. `pull_request_target`
  # runs in the base-repo context with full secret access; combined with checking out
  # the PR head, it lets any fork PR run arbitrary code with our secrets and exfiltrate
  # them. With `pull_request`, fork PRs run in an isolated context with no secret access.
  # Fork PRs run only the non-secret steps (install + pre-commit). To run the full
  # secret-backed suite on an external PR, a maintainer uses the `workflow_dispatch`
  # trigger below AFTER reviewing the diff (dispatch runs the PR's code WITH secrets).
  pull_request:
    branches:
      - main
  # Full live suite, including agent, persona and vault-with-agent tests that
  # pull requests skip. Scheduled runs only run the live suite.
  schedule:
    - cron: '0 */4 * * 1-5'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run the FULL secret-backed CI on. For external (fork) PRs, only dispatch after reviewing the diff - this runs the contributor''s code with our secrets.'
        required: true

concurrency:
  # PR runs share a group so a new push cancels the superseded run. Every other run (main
  # pushes, manual runs) gets its own group so none is cancelled or replaced while queued.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CACHE_TYPE: "pip"
  NOTTE_API_URL: "https://us-staging.notte.cc"
  DISABLE_TELEMETRY: "true"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
  # True for push, manual dispatch, and same-repo PRs; false for fork PRs. Steps that
  # need secrets are gated on this so fork PRs skip them cleanly instead of failing.
  IS_TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
  # Scope vault creates to this workflow job; cleanup deletes only this prefix.
  NOTTE_CI_VAULT_PREFIX: ci-${{ github.run_id }}-${{ github.job }}

permissions:
  pull-requests: write

jobs:
  # Keep the required workflow running even when every expensive suite is skipped.
  changes:
    permissions:
      contents: read
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-2vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-scope
        id: scope

  lint:
    needs: changes
    if: fromJSON(needs.changes.outputs.scope).python_static
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-4vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 15
    steps:
      - name: Checkout PR code (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Maintainer-only path: runs the dispatched PR's code WITH secrets. Only reach
          # this after reviewing the diff. refs/pull/<n>/head is the PR's head commit.
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head
          persist-credentials: false

      - name: Checkout code (PR or push)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            ref: ${{ github.event.pull_request.head.sha }}
            persist-credentials: false

      - uses: ./.github/actions/python-setup
        with:
          pre-commit: "true"

      - name: Run pre-commit
        env:
          FULL: ${{ fromJSON(needs.changes.outputs.scope).lint_all }}
          BASE_SHA: ${{ fromJSON(needs.changes.outputs.scope).base }}
          HEAD_SHA: ${{ fromJSON(needs.changes.outputs.scope).head }}
          DOCS_LINKS: ${{ fromJSON(needs.changes.outputs.scope).docs_links }}
        run: |
          if [ "$FULL" = true ]; then
            uv run --active pre-commit run --all-files
          else
            git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
            uv run --active pre-commit run --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA"
            if [ "$DOCS_LINKS" = true ]; then
              uv run --active pre-commit run check-docs-broken-links --all-files
            fi
          fi

      - name: Note - secret-backed tests skipped (fork PR)
        if: ${{ env.IS_TRUSTED != 'true' }}
        run: |
          echo "This is a fork PR. Steps that require secrets (Vertex auth + the pytest suite)"
          echo "were skipped - fork PRs intentionally have no access to repository secrets."
          echo "Build, install, and pre-commit (lint + type checks) ran above and reflect your change."
          echo "A maintainer can run the full secret-backed suite after reviewing the diff via"
          echo "'Run workflow' (workflow_dispatch) with this PR number."

  # Tests without staging API calls run independently on a larger runner.
  unit:
    needs: changes
    if: >-
      fromJSON(needs.changes.outputs.scope).python_unit &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-8vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 20
    env:
      SUITE: unit
      REQUIRES_STAGING: "false"
      PYTEST_ARGS: -n logical tests --ignore=tests/integration --ignore=tests/examples/test_examples.py --ignore=tests/examples/test_readme.py
      COVERAGE_FILE: .coverage.unit
    steps: &test-steps
      - name: Checkout PR code (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Maintainer-only path: runs the dispatched PR's code WITH secrets. Only reach
          # this after reviewing the diff. refs/pull/<n>/head is the PR's head commit.
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head
          persist-credentials: false

      - name: Checkout code (PR or push)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            ref: ${{ github.event.pull_request.head.sha }}
            persist-credentials: false

      - id: 'auth'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.VERTEX_AI }}

      - uses: ./.github/actions/python-setup
        with:
          browsers: "true"

      - name: Verify environment variables
        env:
          NOTTE_API_KEY: ${{ env.REQUIRES_STAGING == 'true' && (secrets.NOTTE_API_KEY_CI_PY || secrets.NOTTE_API_KEY) || '' }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          required=(GOOGLE_APPLICATION_CREDENTIALS)
          if [ "$REQUIRES_STAGING" = "true" ]; then
            required+=(NOTTE_API_KEY SMTP_SERVER EMAIL_SENDER EMAIL_PASSWORD)
          fi
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "$name is not set. For an external/fork PR, a maintainer should review the diff and run this workflow via 'Run workflow' (workflow_dispatch) with the PR number."
              exit 1
            fi
          done
          echo "Environment variables are set"

      - name: Wait for the API to be ready
        if: env.REQUIRES_STAGING == 'true'
        # The staging API scales to zero when idle and wakes on the first request.
        uses: ./.github/actions/wait-for-api
        with:
          api-url: ${{ env.NOTTE_API_URL }}

      - name: Run tests
        env:
          NOTTE_API_KEY: ${{ env.REQUIRES_STAGING == 'true' && (secrets.NOTTE_API_KEY_CI_PY || secrets.NOTTE_API_KEY) || '' }}
          NOTTE_VAULT_TEST_EMAIL: ${{ secrets.NOTTE_VAULT_TEST_EMAIL }}
          NOTTE_VAULT_TEST_PASSWORD: ${{ secrets.NOTTE_VAULT_TEST_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          # PYTEST_ARGS holds several arguments; split it on purpose.
          # shellcheck disable=SC2086
          uv run pytest $PYTEST_ARGS ${PYTEST_MARKERS:+-m "$PYTEST_MARKERS"} --durations=10 --junitxml="pytest-$SUITE.xml" --cov=packages --cov-report=

      - name: Cleanup vaults created by this run
        if: always() && env.REQUIRES_STAGING == 'true'
        env:
          NOTTE_API_KEY: ${{ env.REQUIRES_STAGING == 'true' && (secrets.NOTTE_API_KEY_CI_PY || secrets.NOTTE_API_KEY) || '' }}
        run: uv run python scripts/cleanup_ci_vaults.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-${{ env.SUITE }}
          path: |
            .coverage.*
            pytest-*.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  # Live tests against the staging API, split into shards. Pull requests run the smoke
  # scope (no agent, persona or vault-with-agent tests) in two shards; main, scheduled
  # and manual runs run everything in four.
  live:
    needs: changes
    if: >-
      fromJSON(needs.changes.outputs.scope).python_live &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-4vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 20
    # All live suites for a ref share one queue so they do not hit the API at once.
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[1, 2]' || '[1, 2, 3, 4]') }}
    env:
      SUITE: live-${{ matrix.shard }}
      REQUIRES_STAGING: "true"
      NOTTE_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      # Two workers per shard: all live suites share the staging API, which slows sharply
      # (vault and persona calls 5-15x) when too many clients hit it at once.
      PYTEST_ARGS: -n 2 tests/integration
      PYTEST_MARKERS: ${{ github.event_name == 'pull_request' && 'not live_heavy' || '' }}
      COVERAGE_FILE: .coverage.live-${{ matrix.shard }}
      # Shards share a job name; give each its own vault prefix so cleanups stay separate.
      NOTTE_CI_VAULT_PREFIX: ci-${{ github.run_id }}-${{ github.job }}-${{ matrix.shard }}
    steps: *test-steps

  # The SDK reads the API key saved by `notte auth login`. Store keys with the CLI's own code
  # (from the notte-cli submodule) on each OS and check the SDK reads them back. Needs no secrets.
  cli-contract:
    needs: changes
    if: fromJSON(needs.changes.outputs.scope).cli_contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, store: file }
          - { os: ubuntu-24.04, store: secret-service }
          - { os: macos-15, store: "" }
          - { os: windows-2025, store: "" }
    name: cli-contract (${{ matrix.os }}${{ matrix.store && format(', {0}', matrix.store) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NOTTE_CLI_CONTRACT: "1"
      NOTTE_CLI_CONTRACT_STORE: ${{ matrix.store }}
      # Password of the throwaway keychain the macOS job creates.
      NOTTE_CLI_CONTRACT_KEYCHAIN_PASSWORD: ci # pragma: allowlist secret
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout PR code (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head
          persist-credentials: false

      - name: Checkout code (PR or push)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - run: git submodule update --init notte-cli

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: notte-cli/go.mod
          cache-dependency-path: notte-cli/go.sum

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Use a dedicated, unlocked default keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p "$NOTTE_CLI_CONTRACT_KEYCHAIN_PASSWORD" notte-ci.keychain
          security set-keychain-settings notte-ci.keychain
          security unlock-keychain -p "$NOTTE_CLI_CONTRACT_KEYCHAIN_PASSWORD" notte-ci.keychain
          security list-keychains -d user -s notte-ci.keychain
          security default-keychain -d user -s notte-ci.keychain

      - name: Install a Secret Service
        if: matrix.store == 'secret-service'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus
          # Creating a collection needs an interactive prompt, so provide the
          # collection the CLI uses up front, as an unencrypted keyring.
          mkdir -p ~/.local/share/keyrings
          printf '[keyring]\ndisplay-name=notte-cli\nctime=0\nmtime=0\nlock-on-idle=false\nlock-after=false\n' \
            > ~/.local/share/keyrings/notte-cli.keyring

      - name: Run the contract test
        run: |
          cmd="uv run --isolated --no-project --python 3.11 \
            --with-editable ./packages/notte-core --with-editable ./packages/notte-sdk --with pytest --with pytest-timeout \
            pytest tests/sdk/test_cli_keyring_contract.py --noconftest -p no:cacheprovider -v -rs"
          if [ "$NOTTE_CLI_CONTRACT_STORE" = secret-service ]; then
            dbus-run-session -- bash -c "echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null && $cmd"
          else
            $cmd
          fi

  # Docs assertions need neither the SDK workspace nor cloud credentials.
  docs:
    permissions:
      contents: read
    needs: changes
    # Manual runs already execute these assertions in the full unit suite.
    if: >-
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      fromJSON(needs.changes.outputs.scope).python_docs
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-2vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir pytest pyyaml
      - run: python -m pytest -c /dev/null --rootdir=. tests/docs tests/test_generate_llms_offline.py --noconftest -q

  # The required check stays present and waits for every selected Python suite.
  tests:
    needs: [changes, lint, unit, live, cli-contract, docs]
    if: always()
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-2vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 10
    steps:
      - name: Check suite results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          results = {name: job["result"] for name, job in json.load(sys.stdin).items()}
          print(results)
          sys.exit(results["changes"] != "success" or any(result in ("failure", "cancelled") for result in results.values()))
          '

      - name: Checkout code
        id: checkout
        if: >-
          always() && github.event_name == 'pull_request' && env.IS_TRUSTED == 'true' &&
          (needs.unit.result != 'skipped' || needs.live.result != 'skipped')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install uv
        if: always() && steps.checkout.outcome == 'success'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Download test results
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pytest-*
          path: results
          merge-multiple: true

      - name: Combine coverage and test results
        if: always() && steps.checkout.outcome == 'success'
        run: |
          uvx coverage==7.10.7 combine results/.coverage.*
          {
            echo "---------- coverage: platform linux, combined unit and live suites ----------"
            uvx coverage==7.10.7 report -m --skip-covered
          } > pytest-coverage.txt
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          merged = ET.Element("testsuite", name="pytest")
          totals = dict.fromkeys(("tests", "errors", "failures", "skipped"), 0)
          duration = 0.0
          for path in sorted(glob.glob("results/pytest-*.xml")):
              root = ET.parse(path).getroot()
              for suite in root.iter("testsuite"):
                  for key in totals:
                      totals[key] += int(suite.get(key, 0))
                  duration += float(suite.get("time", 0))
                  merged.extend(suite.findall("testcase"))
          for key, value in totals.items():
              merged.set(key, str(value))
          merged.set("time", f"{duration:.3f}")
          tree = ET.ElementTree(ET.Element("testsuites"))
          tree.getroot().append(merged)
          tree.write("pytest.xml", encoding="utf-8", xml_declaration=True)
          PY

      - name: Pytest coverage comment
        if: always() && steps.checkout.outcome == 'success'
        uses: MishaKav/pytest-coverage-comment@9ee59af31bd7bcada1cc496f086b407122602dbd # v1.12.3
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
