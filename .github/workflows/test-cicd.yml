name: pytest cicd

on:
  workflow_call:
    inputs:
      scope:
        description: Suite decisions from the shared push or PR selector.
        type: string
        default: ''
      source_sha:
        description: Immutable source commit validated by the coordinating workflow
        type: string
        default: ''
      llm_provider:
        description: Extraction provider selected from live PR metadata
        type: string
        default: openrouter
  # Periodic full live coverage; offline tests remain the secret-free PR gate.
  schedule:
    - cron: '0 */4 * * 1-5'
  # SECURITY: Automatic runs use pull_request in ci.yml, never pull_request_target.
  # Forks receive no secrets. Dispatch runs the reviewed PR's code WITH secrets.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run the FULL secret-backed CI on. For external (fork) PRs, only dispatch after reviewing the diff - this runs the contributor''s code with our secrets.'
        required: true


env:
  CACHE_TYPE: "pip"
  NOTTE_API_URL: "https://us-staging.notte.cc"
  DISABLE_TELEMETRY: "true"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
  # True for push, manual dispatch, and same-repo PRs; false for fork PRs. Steps that
  # need secrets are gated on this so fork PRs skip them cleanly instead of failing.
  IS_TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
  # Scope vault creates to this workflow job; cleanup deletes only this prefix.
  NOTTE_CI_VAULT_PREFIX: ci-${{ github.run_id }}-${{ github.job }}

permissions:
  contents: read
  pull-requests: write

jobs:
  # Scheduled and manual runs select locally; automatic runs reuse the caller scope.
  changes:
    permissions:
      contents: read
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-2vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 5
    outputs:
      scope: ${{ inputs.scope || steps.scope.outputs.scope }}
    steps:
      - name: Validate supplied scope
        if: inputs.scope != ''
        working-directory: ${{ github.workspace }}
        env:
          SCOPE: ${{ inputs.scope }}
        run: python3 -c 'import json, os; json.loads(os.environ["SCOPE"])'
      - name: Checkout code
        if: inputs.scope == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-scope
        if: inputs.scope == ''
        id: scope

  checks:
    needs: changes
    if: fromJSON(needs.changes.outputs.scope).file_checks
    concurrency:
      group: notte-offline-test-cicd-checks-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-4vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 15
    steps:
      - name: Checkout PR code (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Maintainer-only path: runs the dispatched PR's code WITH secrets. Only reach
          # this after reviewing the diff. refs/pull/<n>/head is the PR's head commit.
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout code (PR or push)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/python-setup
        if: fromJSON(needs.changes.outputs.scope).python_static || fromJSON(needs.changes.outputs.scope).lint_all
        with:
          pre-commit: "true"

      - name: Set up standalone file checks
        if: >-
          (github.event_name == 'push' || github.event_name == 'pull_request') &&
          !fromJSON(needs.changes.outputs.scope).python_static && !fromJSON(needs.changes.outputs.scope).lint_all
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Run pre-commit
        env:
          FULL: ${{ fromJSON(needs.changes.outputs.scope).lint_all }}
          BASE_SHA: ${{ fromJSON(needs.changes.outputs.scope).base }}
          HEAD_SHA: ${{ fromJSON(needs.changes.outputs.scope).head }}
          DOCS_LINKS: ${{ fromJSON(needs.changes.outputs.scope).docs_links }}
          PYTHON_SETUP: ${{ fromJSON(needs.changes.outputs.scope).python_static || fromJSON(needs.changes.outputs.scope).lint_all }}
        run: |
          if [ "$PYTHON_SETUP" = true ]; then
            runner=(uv run --active pre-commit)
          else
            runner=(uvx --from pre-commit==4.6.2 pre-commit)
          fi
          if [ "$FULL" = true ]; then
            "${runner[@]}" run --all-files
          else
            "${runner[@]}" run --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA"
            if [ "$DOCS_LINKS" = true ]; then
              "${runner[@]}" run check-docs-broken-links --all-files
            fi
          fi

      - name: Note - secret-backed tests skipped (fork PR)
        if: ${{ env.IS_TRUSTED != 'true' }}
        run: |
          echo "This is a fork PR. Steps that require secrets (the live pytest suite)"
          echo "were skipped - fork PRs intentionally have no access to repository secrets."
          echo "Build, install, and pre-commit (lint + type checks) ran above and reflect your change."
          echo "A maintainer can run the full secret-backed suite after reviewing the diff via"
          echo "'Run workflow' (workflow_dispatch) with this PR number."

  # Full offline coverage runs on the development Python; the supported floor runs
  # syntax/import checks, SDK/core units and a browser lifecycle smoke test.
  # Both gates use only localhost and run on fork PRs without secrets.
  tests:
    name: ${{ matrix.python == '3.15' && 'tests' || 'compatibility' }} (${{ matrix.python }})
    needs: changes
    if: fromJSON(needs.changes.outputs.scope).python_unit
    concurrency:
      group: notte-offline-test-cicd-tests-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.python }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Full suite on the newest Python; compatibility gate on the supported floor.
        python: ["3.15", "3.11"]
    steps:
      - name: Checkout PR code (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Maintainer-only path: runs the dispatched PR's code WITH secrets. Only reach
          # this after reviewing the diff. refs/pull/<n>/head is the PR's head commit.
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head

      - name: Checkout code (PR or push)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/python-setup
        with:
          browsers: "true"
          pre-commit: ${{ matrix.python == '3.15' && 'true' || 'false' }}
          python-version: ${{ matrix.python }}

      - name: Run full unit suite
        if: matrix.python == '3.15'
        run: |
          set -o pipefail
          make test-cicd | tee pytest-coverage.txt

      - name: Check Python 3.11 compatibility
        if: matrix.python == '3.11'
        run: make test-compat

      # Next to the full suite's parallel browsers, a stalled CPU stretches every duration. This leg's other steps are
      # short, so the duration bounds run here, one test at a time, without adding to the job's wall time.
      - name: Run duration bounds one at a time
        if: matrix.python == '3.11'
        run: make test-timing

      - name: Test compatible dependency versions (manual trigger)
        if: matrix.python == '3.15' && github.event_name == 'workflow_dispatch'
        # Preserve the full reviewed manual gate. Automatic runs execute this
        # command in the independent compatible-dependencies job instead.
        run: >-
          uv run --with websockets==15.0.1 --with beautifulsoup4==4.14.3 --with posthog==7.0.1
          pytest -n logical tests/sdk tests/browser tests/llm tests/data tests/test_telemetry.py tests/test_telemetry_delivery.py -m "not staging and not live and not timing" -q

      - name: Note - staging-and-live skipped (fork PR)
        if: ${{ env.IS_TRUSTED != 'true' }}
        run: |
          echo "This is a fork PR. The staging-and-live job (Notte API + third-party websites)"
          echo "was skipped - fork PRs intentionally have no access to repository secrets."
          echo "Pre-commit and the offline unit suite ran above and reflect your change."
          echo "A maintainer can run staging-and-live after reviewing the diff via"
          echo "'Run workflow' (workflow_dispatch) with this PR number."

      - name: Pytest coverage comment
        # Fork PRs get a read-only token, so they cannot post the comment. One leg posts it.
        if: ${{ always() && matrix.python == '3.15' && fromJSON(needs.changes.outputs.scope).python_unit && github.ref != 'refs/heads/main' && env.IS_TRUSTED == 'true' }}
        uses: MishaKav/pytest-coverage-comment@9ee59af31bd7bcada1cc496f086b407122602dbd # v1.12.3
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml

  # Run the lower-bound dependency contracts alongside the locked-version suite.
  # Both remain required through the reusable workflow's result in CI / tests.
  compatible-dependencies:
    needs: changes
    # Dispatch already runs this suite in the existing reviewed manual job.
    # Keep arbitrary PR input out of this job's default-branch cache context.
    if: github.event_name != 'workflow_dispatch' && fromJSON(needs.changes.outputs.scope).python_unit
    permissions:
      contents: read
    concurrency:
      group: notte-offline-test-cicd-compatible-dependencies-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/python-setup
        with:
          browsers: "true"
          python-version: "3.15"

      - name: Test compatible dependency versions
        # The locked-version suite also exercises these contracts. Library
        # lower bounds must allow existing consumers to keep compatible versions.
        run: >-
          uv run --with websockets==15.0.1 --with beautifulsoup4==4.14.3 --with posthog==7.0.1
          pytest -n logical tests/sdk tests/browser tests/llm tests/data tests/test_telemetry.py tests/test_telemetry_delivery.py -m "not staging and not live and not timing" -q

  # Everything marked `staging` (Notte API, us-staging) or `live` (third-party websites, LLM
  # providers), including marked tests outside tests/integration. These depend on
  # services outside this repo, so failures are retried (`make test-live`). They
  # run separately from offline tests but still feed the caller's CI / tests gate.
  staging-and-live:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.scope).python_live && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [1, 2]
    env:
      NOTTE_TEST_SHARD: ${{ matrix.shard }}/2
      NOTTE_CI_VAULT_PREFIX: ci-${{ github.run_id }}-${{ github.job }}-${{ matrix.shard }}
    concurrency:
      group: notte-live-api-staging
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout PR code (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Maintainer-only path: runs the dispatched PR's code WITH secrets. Only reach
          # this after reviewing the diff. refs/pull/<n>/head is the PR's head commit.
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head

      - name: Checkout code (PR or push)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/current-head

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
            enable-cache: true
            cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: ${{ env.CACHE_TYPE }}

      - name: Cache patchright
        id: cache-patchright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-patchright-${{ hashFiles('**/uv.lock') }}-v2
          restore-keys: |
            ${{ runner.os }}-patchright-${{ hashFiles('**/uv.lock') }}-
            ${{ runner.os }}-patchright-

      - name: Install dependencies
        run: uv sync --dev --all-extras

      - name: Install patchright
        if: steps.cache-patchright.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss - installing patchright"
          uv run patchright install --with-deps chromium --no-shell

      - name: Verify environment variables
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_PY || secrets.NOTTE_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          if [ -z "$NOTTE_API_KEY" ]; then
            echo "NOTTE_API_KEY is not set. For an external/fork PR, a maintainer should review the diff and run this workflow via 'Run workflow' (workflow_dispatch) with the PR number."
            exit 1
          fi
          # The SMTP test (tests/integration/sdk/test_persona_inbox.py) skips itself without these, so only warn.
          for name in SMTP_SERVER EMAIL_SENDER EMAIL_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not set, the SMTP test will be skipped"
            fi
          done
          echo "Environment variables are set"

      - name: Wait for the API to be ready
        uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc

      - name: Run staging and live tests
        env:
          # The coordinator verifies explicit authorization for this run/head. Forks receive no key.
          NOTTE_CI_LLM_PROVIDER: ${{ inputs.llm_provider || 'openrouter' }}
          NOTTE_LLM_BASE_URL: https://openrouter.ai/api/v1
          NOTTE_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NOTTE_LLM_MODEL: google/gemini-3.5-flash-lite
          NOTTE_TEST_DEFAULT_MODEL: google/gemini-3.8-flash
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_PY || secrets.NOTTE_API_KEY }}
          NOTTE_VAULT_TEST_EMAIL: ${{ secrets.NOTTE_VAULT_TEST_EMAIL }}
          NOTTE_VAULT_TEST_PASSWORD: ${{ secrets.NOTTE_VAULT_TEST_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          test "$NOTTE_CI_LLM_PROVIDER" = openrouter || { echo 'Unsupported CI model route: use OpenRouter'; exit 1; }
          test -n "$NOTTE_LLM_API_KEY" || { echo '::error::Set the OPENROUTER_API_KEY repository secret for staging extraction'; exit 1; }
          make test-live PYTEST_LIVE='uv run pytest -n 2 tests -m "staging or live" --ignore=tests/examples/test_examples.py --ignore=tests/examples/test_readme.py --ignore=tests/llm/test_provider_matrix.py --rerun-show-tracebacks'

      - name: Upload failed-attempt diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-live-diagnostics-${{ matrix.shard }}-${{ github.run_attempt }}
          path: .test-artifacts/flake-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup vaults created by this run
        if: ${{ always() }}
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_PY || secrets.NOTTE_API_KEY }}
        run: uv run python scripts/cleanup_ci_vaults.py

  # Local extraction only: no staging API, cloud sessions, or NOTTE_API_KEY needed.
  llm-provider-matrix:
    needs: changes
    if: fromJSON(needs.changes.outputs.scope).llm_provider_live
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout PR code (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head
          persist-credentials: false
      - name: Checkout code (PR or push)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/current-head

      - name: Check provider matrix credentials
        if: env.OPENROUTER_API_KEY == ''
        run: |
          if [ "$IS_TRUSTED" = true ]; then
            echo '::error::Set the OPENROUTER_API_KEY repository secret for the provider matrix'
            exit 1
          fi
          echo "Fork/external PRs intentionally receive no secrets. A maintainer can dispatch full CI after reviewing the diff."
          echo "Provider matrix skipped: OPENROUTER_API_KEY is absent." >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/python-setup
        if: env.OPENROUTER_API_KEY != ''
      - name: Run local provider extraction matrix
        if: env.OPENROUTER_API_KEY != ''
        run: >-
          uv run --no-sync pytest tests/llm/test_provider_matrix.py -m live -n 6
          --dist loadgroup -v -rA --junitxml=llm-provider-matrix.xml -o junit_family=legacy
      - name: Summarize provider results and response-format paths
        if: always() && env.OPENROUTER_API_KEY != ''
        run: python scripts/llm_matrix_report.py llm-provider-matrix.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload provider results
        if: always() && env.OPENROUTER_API_KEY != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llm-provider-matrix
          path: |
            llm-provider-matrix.xml
            .test-artifacts/flake-diagnostics
          include-hidden-files: true
          if-no-files-found: error

  cli-contract:
    needs: changes
    if: fromJSON(needs.changes.outputs.scope).cli_contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, store: file }
          - { os: ubuntu-24.04, store: secret-service }
          - { os: macos-15, store: "" }
          - { os: windows-2025, store: "" }
    name: cli-contract (${{ matrix.os }}${{ matrix.store && format(', {0}', matrix.store) || '' }})
    concurrency:
      group: notte-offline-test-cicd-cli-contract-${{ github.event.pull_request.number || github.run_id }}-${{ format('{0}-{1}', matrix.os, matrix.store) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NOTTE_CLI_CONTRACT: "1"
      NOTTE_CLI_CONTRACT_STORE: ${{ matrix.store }}
      # Password of the throwaway keychain the macOS job creates.
      NOTTE_CLI_CONTRACT_KEYCHAIN_PASSWORD: ci # pragma: allowlist secret
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout PR code (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head
          persist-credentials: false

      - name: Checkout code (PR or push)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - run: git submodule update --init notte-cli

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: notte-cli/go.mod
          cache-dependency-path: notte-cli/go.sum

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Use a dedicated, unlocked default keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p "$NOTTE_CLI_CONTRACT_KEYCHAIN_PASSWORD" notte-ci.keychain
          security set-keychain-settings notte-ci.keychain
          security unlock-keychain -p "$NOTTE_CLI_CONTRACT_KEYCHAIN_PASSWORD" notte-ci.keychain
          security list-keychains -d user -s notte-ci.keychain
          security default-keychain -d user -s notte-ci.keychain

      - name: Install a Secret Service
        if: matrix.store == 'secret-service'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus
          # Creating a collection needs an interactive prompt, so provide the
          # collection the CLI uses up front, as an unencrypted keyring.
          mkdir -p ~/.local/share/keyrings
          printf '[keyring]\ndisplay-name=notte-cli\nctime=0\nmtime=0\nlock-on-idle=false\nlock-after=false\n' \
            > ~/.local/share/keyrings/notte-cli.keyring

      - name: Run the contract test
        run: |
          cmd="uv run --isolated --no-project --python 3.11 \
            --with-editable ./packages/notte-core --with-editable ./packages/notte-sdk --with pytest --with pytest-timeout \
            pytest tests/sdk/test_cli_keyring_contract.py --noconftest -p no:cacheprovider -v -rs"
          if [ "$NOTTE_CLI_CONTRACT_STORE" = secret-service ]; then
            dbus-run-session -- bash -c "echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null && $cmd"
          else
            $cmd
          fi

  # Docs assertions need neither the SDK workspace nor cloud credentials.
  docs:
    permissions:
      contents: read
    needs: changes
    # Manual runs already execute these assertions in the full unit suite.
    if: >-
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      fromJSON(needs.changes.outputs.scope).python_docs
    concurrency:
      group: notte-offline-test-cicd-docs-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-2vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir pytest pyyaml
      - run: python -m pytest -c /dev/null --rootdir=. tests/docs tests/test_generate_llms_offline.py --noconftest -q
