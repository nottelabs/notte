name: pytest cicd

on:
  push:
    branches:
      - main
  # SECURITY: Use `pull_request`, never `pull_request_target`. `pull_request_target`
  # runs in the base-repo context with full secret access; combined with checking out
  # the PR head, it lets any fork PR run arbitrary code with our secrets and exfiltrate
  # them. With `pull_request`, fork PRs run in an isolated context with no secret access.
  # Fork PRs run the `tests` job (pre-commit + the offline unit suite, which needs no
  # secrets) and skip `staging-and-live`. To run that job on an external PR, a maintainer
  # uses the `workflow_dispatch` trigger below AFTER reviewing the diff (dispatch runs the
  # PR's code WITH secrets).
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run the FULL secret-backed CI on. For external (fork) PRs, only dispatch after reviewing the diff - this runs the contributor''s code with our secrets.'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CACHE_TYPE: "pip"
  NOTTE_API_URL: "https://us-staging.notte.cc"
  DISABLE_TELEMETRY: "true"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
  # True for push, manual dispatch, and same-repo PRs; false for fork PRs. Steps that
  # need secrets are gated on this so fork PRs skip them cleanly instead of failing.
  # (Job-level `if:` cannot read `env`, so staging-and-live repeats the expression.)
  IS_TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
  # Scope vault creates to this workflow job; cleanup deletes only this prefix.
  NOTTE_CI_VAULT_PREFIX: ci-${{ github.run_id }}-${{ github.job }}

permissions:
  # Needed to check out private repositories (e.g. the notte-v2 staging repo).
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-2vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.scope.outputs.unit }}
      live: ${{ steps.scope.outputs.live }}
    steps:
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Which suites does this change need?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            echo "unit=false" >> "$GITHUB_OUTPUT"
            echo "live=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != "pull_request" ]; then
            echo "unit=true" >> "$GITHUB_OUTPUT"
            echo "live=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          unit=false
          live=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              # This workflow and its setup action: run everything.
              .github/workflows/test-cicd.yml|.github/actions/*) unit=true; live=true ;;
              # Package code, including Markdown prompt templates: run everything.
              packages/*|src/*|tests/*) unit=true; live=true ;;
              # Some unit tests read the docs; the live suite does not.
              docs/*) unit=true ;;
              # Covered by their own workflows (Node SDK, README check) or not code.
              node-sdk/*|.github/*|*.md|LICENSE) ;;
              browserarena|notte-cli|notte-skills|templates|integrations/*|example-apps/*) ;;
              *) unit=true; live=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")
          echo "unit=$unit" >> "$GITHUB_OUTPUT"
          echo "live=$live" >> "$GITHUB_OUTPUT"
          echo "unit=$unit live=$live"


  # The PR gate: pre-commit plus every test not marked `staging` or `live` (see the markers in
  # pyproject.toml). Offline - a local browser and localhost only, no secrets - so it runs on
  # fork PRs too and cannot be failed by a third-party website or a staging deploy.
  tests:
    needs: changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout PR code (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Maintainer-only path: runs the dispatched PR's code WITH secrets. Only reach
          # this after reviewing the diff. refs/pull/<n>/head is the PR's head commit.
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head

      - name: Checkout code (PR or push)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/python-setup
        with:
          browsers: "true"
          pre-commit: "true"

      - name: Check generated SDK models
        run: make sdk-codegen-check

      - name: Run pre-commit
        run: uv run --active pre-commit run --all-files

      - name: Run unit tests
        if: needs.changes.outputs.unit == 'true'
        run: |
          set -o pipefail
          make test-cicd | tee pytest-coverage.txt

      - name: Note - staging-and-live skipped (fork PR)
        if: ${{ env.IS_TRUSTED != 'true' }}
        run: |
          echo "This is a fork PR. The staging-and-live job (Notte API + third-party websites)"
          echo "was skipped - fork PRs intentionally have no access to repository secrets."
          echo "Pre-commit and the offline unit suite ran above and reflect your change."
          echo "A maintainer can run staging-and-live after reviewing the diff via"
          echo "'Run workflow' (workflow_dispatch) with this PR number."

      - name: Pytest coverage comment
        # Fork PRs get a read-only token, so they cannot post the comment.
        if: ${{ always() && needs.changes.outputs.unit == 'true' && github.ref != 'refs/heads/main' && env.IS_TRUSTED == 'true' }}
        uses: MishaKav/pytest-coverage-comment@9ee59af31bd7bcada1cc496f086b407122602dbd # v1.12.3
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml

  # Everything marked `staging` (Notte API, us-staging) or `live` (third-party websites, LLM
  # providers): all of tests/integration plus a few marked tests elsewhere. These depend on
  # services outside this repo, so failures are retried (`make test-live`) and the job is kept
  # separate from the `tests` gate - do not make it a required check.
  staging-and-live:
    needs: changes
    if: ${{ needs.changes.outputs.live == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [1, 2]
    env:
      NOTTE_TEST_SHARD: ${{ matrix.shard }}/2
      NOTTE_CI_VAULT_PREFIX: ci-${{ github.run_id }}-${{ github.job }}-${{ matrix.shard }}
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout PR code (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Maintainer-only path: runs the dispatched PR's code WITH secrets. Only reach
          # this after reviewing the diff. refs/pull/<n>/head is the PR's head commit.
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head

      - name: Checkout code (PR or push)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            ref: ${{ github.event.pull_request.head.sha }}

      # Mint credentials at the deployment boundary; notte-llm only receives a bearer token.
      - id: 'auth'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.VERTEX_AI }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
            enable-cache: true
            cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: ${{ env.CACHE_TYPE }}

      - name: Cache patchright
        id: cache-patchright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-patchright-${{ hashFiles('**/uv.lock') }}-v2
          restore-keys: |
            ${{ runner.os }}-patchright-${{ hashFiles('**/uv.lock') }}-
            ${{ runner.os }}-patchright-

      - name: Install dependencies
        run: uv sync --dev --all-extras

      - name: Install patchright
        if: steps.cache-patchright.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss - installing patchright"
          uv run patchright install --with-deps chromium --no-shell

      - name: Verify environment variables
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_PY || secrets.NOTTE_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          if [ -z "$NOTTE_API_KEY" ]; then
            echo "NOTTE_API_KEY is not set. For an external/fork PR, a maintainer should review the diff and run this workflow via 'Run workflow' (workflow_dispatch) with the PR number."
            exit 1
          fi
          # The SMTP test (tests/integration/sdk/test_persona_inbox.py) skips itself without these, so only warn.
          for name in SMTP_SERVER EMAIL_SENDER EMAIL_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not set, the SMTP test will be skipped"
            fi
          done
          echo "Environment variables are set"

      - name: Wait for the API to be ready
        uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc

      - name: Configure compatible LLM endpoint
        run: uv run --script .github/scripts/configure_llm.py

      - name: Run staging and live tests
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_PY || secrets.NOTTE_API_KEY }}
          NOTTE_VAULT_TEST_EMAIL: ${{ secrets.NOTTE_VAULT_TEST_EMAIL }}
          NOTTE_VAULT_TEST_PASSWORD: ${{ secrets.NOTTE_VAULT_TEST_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: make test-live PYTEST_LIVE='uv run pytest -n 2 tests -m "staging or live" --ignore=tests/examples/test_examples.py --ignore=tests/examples/test_readme.py'

      - name: Cleanup vaults created by this run
        if: ${{ always() }}
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_PY || secrets.NOTTE_API_KEY }}
        run: uv run python scripts/cleanup_ci_vaults.py
