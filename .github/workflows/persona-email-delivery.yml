name: persona email delivery

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CACHE_TYPE: "pip"
  NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY }}
  NOTTE_API_URL: "https://us-staging.notte.cc"
  NOTTE_TEST_SMTP_HOST: ${{ secrets.NOTTE_TEST_SMTP_HOST }}
  NOTTE_TEST_SMTP_PORT: ${{ secrets.NOTTE_TEST_SMTP_PORT }}
  NOTTE_TEST_SMTP_USERNAME: ${{ secrets.NOTTE_TEST_SMTP_USERNAME }}
  NOTTE_TEST_SMTP_PASSWORD: ${{ secrets.NOTTE_TEST_SMTP_PASSWORD }}
  NOTTE_TEST_SMTP_SENDER: ${{ secrets.NOTTE_TEST_SMTP_SENDER }}
  DISABLE_TELEMETRY: "true"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

permissions:
  contents: read

jobs:
  persona-email-delivery:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: ${{ env.CACHE_TYPE }}

      - name: Cache patchright
        id: cache-patchright
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-patchright-${{ hashFiles('**/uv.lock') }}-v2
          restore-keys: |
            ${{ runner.os }}-patchright-${{ hashFiles('**/uv.lock') }}-
            ${{ runner.os }}-patchright-

      - name: Install dependencies
        run: uv sync --dev --all-extras

      - name: Install patchright
        if: steps.cache-patchright.outputs.cache-hit != 'true'
        run: uv run patchright install --with-deps chromium --no-shell

      - name: Verify environment variables
        run: |
          if [ -z "$NOTTE_API_KEY" ]; then
            echo "NOTTE_API_KEY is not set"
            exit 1
          fi
          if [ -z "$NOTTE_TEST_SMTP_HOST" ]; then
            echo "NOTTE_TEST_SMTP_HOST is not set"
            exit 1
          fi
          if [ -z "$NOTTE_TEST_SMTP_USERNAME" ]; then
            echo "NOTTE_TEST_SMTP_USERNAME is not set"
            exit 1
          fi
          if [ -z "$NOTTE_TEST_SMTP_PASSWORD" ]; then
            echo "NOTTE_TEST_SMTP_PASSWORD is not set"
            exit 1
          fi

      - name: Run persona email delivery test
        run: uv run pytest -s tests/browser/test_tools.py::test_persona_email_delivery_from_smtp
