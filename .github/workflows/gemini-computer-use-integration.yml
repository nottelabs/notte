name: Gemini Computer Use integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/gemini-computer-use-integration.yml
      - examples/gemini-computer-use/**
  push:
    branches: [main]
    paths:
      - .github/workflows/gemini-computer-use-integration.yml
      - examples/gemini-computer-use/**

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: npm ci && npm run typecheck && npm test
        working-directory: examples/gemini-computer-use
      - run: pip install -r requirements.txt
        working-directory: examples/gemini-computer-use
      - run: python -m unittest -v test_agent.py
        working-directory: examples/gemini-computer-use
        env:
          DISABLE_TELEMETRY: 'true'
  browser-handler:
    needs: static
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: npm ci
        working-directory: examples/gemini-computer-use
      - run: pip install -r requirements.txt
        working-directory: examples/gemini-computer-use
      - uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc
          timeout: '300'
      - name: Verify browser actions and cleanup
        working-directory: examples/gemini-computer-use
        env:
          NOTTE_API_URL: https://us-staging.notte.cc
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_EXAMPLES || secrets.NOTTE_API_KEY }}
          NOTTE_GEMINI_LIVE: '1'
          NOTTE_GEMINI_MODEL_LIVE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && '1' || '0' }}
          GEMINI_API_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.GEMINI_API_KEY || '' }}
          DISABLE_TELEMETRY: 'true'
        run: npm test && python -m unittest -v test_agent.py
