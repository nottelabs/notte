name: node sdk cicd

on:
  pull_request:
    paths: ['node-sdk/**', '.github/workflows/node-sdk-*.yml']
  push:
    branches: [main]
    paths: ['node-sdk/**', '.github/workflows/node-sdk-*.yml']
  # Full live suite, including agent, persona and vault-with-agent tests that
  # pull requests skip.
  schedule:
    - cron: '0 */4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs share a group so a new push cancels the superseded run. Every other run (main
  # pushes, manual runs) gets its own group so none is cancelled or replaced while queued.
  group: node-sdk-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: node-sdk

jobs:
  tests:
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-4vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: node-sdk/package-lock.json
      - run: npm ci
      - run: npm run resources:check
      - run: npm run resources:test
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-sdk-coverage-${{ matrix.node }}
          path: node-sdk/coverage/
          if-no-files-found: ignore
      - run: npm run build
      - run: npm pack --dry-run
      - name: Smoke-test built package exports
        run: node scripts/check-package.js

  integration-tests:
    # Same-repository PRs run against staging; fork PRs never receive API credentials.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    needs: tests
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-4vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 45
    # All live suites for a ref share one queue so they do not hit the API at once.
    concurrency:
      group: notte-live-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    # Live files run serially within a shard. Pull requests run the smoke scope in
    # one shard; main, scheduled and manual runs run everything in two.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[1]' || '[1, 2]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - name: Wait for the API to be ready
        # The staging API scales to zero when idle and wakes on the first request.
        uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc
      - name: Run live integration suite
        env:
          NOTTE_API_URL: https://us-staging.notte.cc
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY_CI_NODE || secrets.NOTTE_API_KEY }}
          NOTTE_LIVE_SCOPE: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
        run: |
          test -n "$NOTTE_API_KEY" || { echo 'NOTTE_API_KEY is required'; exit 1; }
          npm run test:integration -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  generated:
    runs-on: ${{ fromJSON('{"github":"ubuntu-24.04","blacksmith":"blacksmith-4vcpu-ubuntu-2404"}')[vars.CI_RUNNER_PROVIDER || 'blacksmith'] }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node-sdk/package-lock.json
      - run: npm ci
      - name: Wait for the API to be ready
        # The staging API scales to zero when idle and wakes on the first request.
        uses: ./.github/actions/wait-for-api
        with:
          api-url: https://us-staging.notte.cc
      - run: npm run check:staging
